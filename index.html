<title>ことのはノート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
:root{
  --paper:#faf6ec;
  --paper-2:#f2ecdd;
  --ink:#2b3350;
  --ink-soft:#5a628a;
  --accent:#c1602c;
  --accent-ink:#7a3416;
  --good:#3f6a52;
  --good-bg:#e3ede6;
  --bad:#b3503f;
  --bad-bg:#f3e1dc;
  --line:#dfd6bd;
  --card:#ffffff;
  --shadow: 0 1px 2px rgba(43,51,80,.06), 0 6px 18px rgba(43,51,80,.08);
  --radius:18px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1b1d2a;
    --paper-2:#232637;
    --ink:#eee7d6;
    --ink-soft:#b9b2c9;
    --accent:#e8894d;
    --accent-ink:#ffd8b8;
    --good:#7fbf9c;
    --good-bg:#20362c;
    --bad:#e08a78;
    --bad-bg:#3a2422;
    --line:#3a3d52;
    --card:#242739;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --paper:#1b1d2a;
  --paper-2:#232637;
  --ink:#eee7d6;
  --ink-soft:#b9b2c9;
  --accent:#e8894d;
  --accent-ink:#ffd8b8;
  --good:#7fbf9c;
  --good-bg:#20362c;
  --bad:#e08a78;
  --bad-bg:#3a2422;
  --line:#3a3d52;
  --card:#242739;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;}
body{
  background:
    radial-gradient(circle at 1px 1px, var(--line) 1px, transparent 1.6px) 0 0/22px 22px,
    var(--paper);
  color:var(--ink);
  font-family:"Zen Kaku Gothic New", "Hiragino Sans", sans-serif;
  min-height:100vh;
  padding-block: 18px;
}
h1,h2,h3,.mincho{font-family:"Shippori Mincho", serif;}
#app{max-width:920px;margin:0 auto;padding:0 18px 60px;}
button{font-family:inherit;color:inherit;}
.tabular{font-variant-numeric:tabular-nums;}

/* ---- top bar ---- */
.topbar{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:4px 0 22px;flex-wrap:wrap;}
.brand{display:flex;align-items:baseline;gap:10px;}
.brand .mark{font-family:"Shippori Mincho",serif;font-weight:800;font-size:26px;color:var(--accent-ink);}
.brand .sub{font-size:12px;color:var(--ink-soft);letter-spacing:.04em;}
.crumb{font-size:13px;color:var(--ink-soft);display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.crumb button{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:13px;padding:2px 4px;text-decoration:underline;text-underline-offset:2px;}
.crumb button:hover{color:var(--accent-ink);}

/* ---- cards / grid ---- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;}
.cat-card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px 18px 16px;box-shadow:var(--shadow); cursor:pointer; text-align:left;
  display:flex;flex-direction:column;gap:10px; position:relative; overflow:hidden;
}
.cat-card:active{transform:scale(.98);}
.cat-card .tag{
  align-self:flex-start;font-size:11px;padding:3px 9px;border-radius:99px;
  background:var(--paper-2); color:var(--ink-soft); letter-spacing:.03em;
}
.cat-card h3{margin:0;font-size:22px;line-height:1.25;}
.cat-card .desc{font-size:12.5px;color:var(--ink-soft);margin:0;}
.bar{height:7px;border-radius:99px;background:var(--paper-2);overflow:hidden;margin-top:2px;}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:99px;}
.cat-card .stats{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-soft);}

.section-title{font-size:14px;color:var(--ink-soft);letter-spacing:.06em;margin:30px 0 10px;text-transform:uppercase;}

/* ---- category screen ---- */
.cat-header{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px;}
.cat-header h2{margin:0;font-size:28px;}
.cat-header .desc{color:var(--ink-soft);font-size:13px;margin-top:4px;}
.modebar{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:26px;}
.mode-btn{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px 16px;text-align:left;cursor:pointer;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:6px;
}
.mode-btn:active{transform:scale(.98);}
.mode-btn .ico{font-size:22px;}
.mode-btn b{font-size:16px;}
.mode-btn span{font-size:12px;color:var(--ink-soft);}
.mode-btn.primary{background:var(--accent);border-color:var(--accent);}
.mode-btn.primary b, .mode-btn.primary span, .mode-btn.primary .ico{color:#fff;}

.weak-list{display:flex;flex-direction:column;gap:8px;}
.weak-row{
  display:flex;justify-content:space-between;gap:10px;align-items:center;
  background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px;
}
.weak-row .w{font-weight:700;}
.weak-row .r{color:var(--ink-soft);font-size:12px;}
.pct{font-size:12.5px;padding:2px 8px;border-radius:99px;background:var(--bad-bg);color:var(--bad);font-weight:700;}
.pct.ok{background:var(--good-bg);color:var(--good);}

/* ---- flashcard (study) ---- */
.study-wrap{display:flex;flex-direction:column;align-items:center;gap:18px;}
.progress-row{width:100%;display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink-soft);}
.progress-row .bar{flex:1;}
.flip-card{
  width:100%;max-width:560px;min-height:320px;perspective:1400px;cursor:pointer;
}
.flip-inner{position:relative;width:100%;height:100%;min-height:320px;transition:transform .5s cubic-bezier(.2,.7,.3,1);transform-style:preserve-3d;}
.flip-card.flipped .flip-inner{transform:rotateY(180deg);}
.face{
  position:absolute;inset:0;backface-visibility:hidden;border-radius:24px;
  background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:32px 26px;gap:14px;
}
.face.back{transform:rotateY(180deg);}
.face .kw{font-family:"Shippori Mincho",serif;font-weight:800;font-size:40px;line-height:1.3;}
.face .cat-tag{position:absolute;top:16px;left:18px;font-size:11px;color:var(--ink-soft);}
.face .hint{position:absolute;bottom:16px;font-size:11.5px;color:var(--ink-soft);}
.face .yomi{font-size:20px;color:var(--accent-ink);font-weight:700;}
.face .meaning{font-size:15.5px;line-height:1.7;max-width:440px;}
.face .example{font-size:13px;color:var(--ink-soft);border-top:1px dashed var(--line);padding-top:10px;margin-top:4px;max-width:440px;}
.face .pairword{font-family:"Shippori Mincho",serif;font-weight:800;font-size:32px;}
.face .arrow{font-size:20px;color:var(--ink-soft);}
.study-controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;}
.icon-btn{
  border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 18px;
  font-size:14px;cursor:pointer;box-shadow:var(--shadow); color:var(--ink);
}
.icon-btn:active{transform:scale(.96);}
.icon-btn.big{padding:14px 26px;font-weight:700;}
.icon-btn.accent{background:var(--accent);border-color:var(--accent);color:#fff;}
.icon-btn.good{background:var(--good);border-color:var(--good);color:#fff;}
.icon-btn.ghost{box-shadow:none;background:transparent;}
select.filter-select{
  border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 12px;font-size:13px;color:var(--ink);
}

/* ---- quiz/test ---- */
.quiz-wrap{display:flex;flex-direction:column;gap:18px;max-width:640px;margin:0 auto;}
.quiz-top{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--ink-soft);}
.score-chip{background:var(--paper-2);border-radius:99px;padding:5px 12px;font-weight:700;color:var(--ink);}
.stem-card{
  background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);
  padding:26px 24px;text-align:center;
}
.stem-instr{font-size:12.5px;color:var(--ink-soft);margin-bottom:14px;letter-spacing:.02em;}
.stem-main{font-size:19px;line-height:1.9;}
.stem-main u.target{text-decoration:none;border-bottom:3px solid var(--accent);font-weight:700;padding:0 2px;}
.stem-word{font-family:"Shippori Mincho",serif;font-size:34px;font-weight:800;margin-top:6px;}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media (max-width:520px){.choices{grid-template-columns:1fr;}}
.choice{
  background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px 14px;
  font-size:16px;cursor:pointer;text-align:center;box-shadow:var(--shadow);line-height:1.5;
}
.choice:active{transform:scale(.97);}
.choice.correct{background:var(--good-bg);border-color:var(--good);color:var(--good);font-weight:700;}
.choice.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);font-weight:700;}
.choice[disabled]{cursor:default;}
.feedback-row{display:flex;justify-content:center;}
.next-btn{opacity:0;pointer-events:none;transition:opacity .2s;}
.next-btn.show{opacity:1;pointer-events:auto;}

.result-card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:34px 26px;text-align:center;max-width:520px;margin:0 auto;}
.result-card .big{font-family:"Shippori Mincho",serif;font-size:46px;font-weight:800;color:var(--accent-ink);}
.miss-list{display:flex;flex-direction:column;gap:8px;margin-top:18px;text-align:left;}
.miss-row{display:flex;justify-content:space-between;background:var(--paper-2);border-radius:10px;padding:8px 12px;font-size:13.5px;}

/* ---- print config ---- */
.form-block{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:20px 22px;margin-bottom:16px;}
.form-block h4{margin:0 0 10px;font-size:14px;color:var(--ink-soft);letter-spacing:.03em;}
.opt-row{display:flex;gap:10px;flex-wrap:wrap;}
.opt{
  border:2px solid var(--line);border-radius:12px;padding:10px 16px;font-size:13.5px;cursor:pointer;background:var(--paper-2);
}
.opt.sel{border-color:var(--accent);background:var(--accent);color:#fff;font-weight:700;}
.count-row{display:flex;align-items:center;gap:12px;}
.count-row input[type=range]{flex:1;}
.preview-list{max-height:260px;overflow:auto;border:1px dashed var(--line);border-radius:12px;padding:10px 14px;font-size:13px;color:var(--ink-soft);}
.preview-list div{padding:4px 0;border-bottom:1px dotted var(--line);}
.homophone-note{background:var(--paper-2);border-left:4px solid var(--accent);border-radius:8px;padding:10px 14px;font-size:12.5px;margin-top:8px;}

footer.tip{margin-top:40px;text-align:center;font-size:12px;color:var(--ink-soft);}

/* ---- print output (screen hidden) ---- */
#printArea{display:none;}
@media print{
  body > *:not(#printArea){display:none !important;}
  body{background:#fff;padding:0;}
  #printArea{display:block !important;}
  .p-page{padding:14mm 12mm;page-break-after:always;}
  .p-page:last-child{page-break-after:auto;}
  .p-head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:16px;}
  .p-head h2{margin:0;font-size:20px;font-family:"Shippori Mincho",serif;}
  .p-namebox{font-size:12px;}
  .p-namebox .line{display:inline-block;width:120px;border-bottom:1px solid #000;margin-left:6px;}
  .p-q{margin-bottom:16px;font-size:14px;line-height:2;page-break-inside:avoid;}
  .p-q .num{font-weight:700;margin-right:6px;}
  .p-q .blank{display:inline-block;min-width:110px;border-bottom:1px solid #000;margin:0 4px;}
  .p-q .katakana-target{text-decoration:underline;text-decoration-style:dotted;}
  .p-answers{font-size:12px;line-height:1.9;column-count:2;}
  .p-hgroup{font-size:11.5px;border:1px solid #000;padding:8px 10px;margin:14px 0;border-radius:4px;}
  .p-title-answers{font-family:"Shippori Mincho",serif;font-size:16px;margin-bottom:10px;}
}
@media not print {
  #printArea{display:none;}
}
</style>

柄でも、礼儀を忘れてはいけないということ。"], "id": "w23"}, {"phrase": "顔が広い", "reading": "かおがひろい", "meaning": "多くの人と知り合いで、交際範囲が広いこと。", "example": "彼は顔が広く、いろいろな人を紹介してくれる。", "distractorMeanings": ["自分の意見を、遠慮なくはっきり言うこと。", "多くの人から、特別に信頼されていること。"], "id": "w24"}, {"phrase": "かっぱの川流れ", "reading": "かっぱのかわながれ", "meaning": "どんなに得意なことでも、時には失敗することがあるということ。", "example": "泳ぎが得意な彼が溺れかけるとは、まさにかっぱの川流れだ。", "distractorMeanings": ["幼いころの性格は、大人になっても変わらないということ。", "見た目が似ていても、中身はまったく違うということ。"], "id": "w25"}, {"phrase": "馬が合う", "reading": "うまがあう", "meaning": "気持ちや性格が合い、気心の知れた仲であること。", "example": "初めて会ったばかりなのに、彼とはとても馬が合う。", "distractorMeanings": ["互いに助け合いながら、支え合って生きていくこと。", "相手の弱点を見つけ出し、うまく利用すること。"], "id": "w26"}, {"phrase": "口をとがらせる", "reading": "くちをとがらせる", "meaning": "不満そうな顔つきをすること。", "example": "妹は叱られて、口をとがらせていた。", "distractorMeanings": ["驚きのあまり、言葉を失ってしまうこと。", "会話の途中に割り込んで、意見を言うこと。"], "id": "w27"}, {"phrase": "口に出す", "reading": "くちにだす", "meaning": "心の中で思っていることを、実際に言葉にして言うこと。", "example": "思っていることを口に出さないと、相手には伝わらないよ。", "distractorMeanings": ["人の秘密を、こっそり他の人に広めてしまうこと。", "相手の話の途中から、勝手に割り込んで話すこと。"], "id": "w28"}, {"phrase": "弘法にも筆の誤り", "reading": "こうぼうにもふでのあやまり", "meaning": "どんな名人でも、時には失敗することがあるということ。", "example": "名人と呼ばれる人でもミスをするとは、弘法にも筆の誤りだ。", "distractorMeanings": ["幼いころの性格は、年をとっても変わらないということ。", "小さく弱いものにも、それ相応の意地や根性があるということ。"], "id": "w29"}, {"phrase": "手に余る", "reading": "てにあまる", "meaning": "自分の力ではとても処理しきれないこと。", "example": "この仕事は難しすぎて、私の手に余る。", "distractorMeanings": ["程度がひどすぎて、黙って見ていられないこと。", "苦労した末に、ようやく望みのものを手に入れること。"], "id": "w30"}, {"phrase": "手に入れる", "reading": "てにいれる", "meaning": "欲しかった物事を、自分のものにすること。", "example": "ずっと欲しかったゲームを、ついに手に入れた。", "distractorMeanings": ["知識や技術を、努力して自分のものにすること。", "多くの人から、高い評価を得ること。"], "id": "w31"}, {"phrase": "猫に小判", "reading": "ねこにこばん", "meaning": "価値のあるものでも、その良さがわからない人には無駄だということ。", "example": "この専門書を彼にあげても、猫に小判だろう。", "distractorMeanings": ["少しばかりの努力や助けでは、ほとんど効果がないこと。", "立派なものも、数が多いとかえって目立たなくなるということ。"], "id": "w32"}, {"phrase": "寝耳に水", "reading": "ねみみにみず", "meaning": "思いがけない出来事に、非常に驚くことのたとえ。", "example": "急な転校の話を聞いて、まさに寝耳に水だった。", "distractorMeanings": ["意見や忠告をしても、まったく効き目がないこと。", "長い苦労の末に、ついに成功をつかむこと。"], "id": "w33"}, {"phrase": "眉をひそめる", "reading": "まゆをひそめる", "meaning": "不快に思ったり、心配したりして顔をしかめること。", "example": "大きな騒音に、周りの人たちは眉をひそめた。", "distractorMeanings": ["驚きのあまり、目を大きく見開くこと。", "うれしさのあまり、思わずほほえむこと。"], "id": "w34"}, {"phrase": "足を引っ張る", "reading": "あしをひっぱる", "meaning": "他人の成功や物事の進行を邪魔すること。", "example": "チームの足を引っ張らないように、一生懸命練習した。", "distractorMeanings": ["うまくいっていることに割り込んで、水を差すこと。", "危険を避けて、慎重に用心しながら行動すること。"], "id": "w35"}, {"phrase": "一寸の虫にも五分の魂", "reading": "いっすんのむしにもごぶのたましい", "meaning": "どんなに小さく弱いものにも、それ相応の意地や考えがあるということ。", "example": "小さな子供だからと侮ってはいけない、一寸の虫にも五分の魂だ。", "distractorMeanings": ["幼いころの性格は、年をとっても変わらないということ。", "どんな名人でも、時には失敗することがあるということ。"], "id": "w36"}, {"phrase": "雨降って地固まる", "reading": "あめふってじかたまる", "meaning": "もめごとの後は、かえって物事が良い方向に安定するということ。", "example": "けんかをしたけれど、雨降って地固まるで前より仲良くなった。", "distractorMeanings": ["つらくても、がまん強く続ければ必ず成功するということ。", "小さな出来事がきっかけで、大きな問題に発展するということ。"], "id": "w37"}, {"phrase": "口を利く", "reading": "くちをきく", "meaning": "言葉を話すこと。また、人と人の間を取り持つこと。", "example": "先生が口を利いてくれたおかげで、話がまとまった。", "distractorMeanings": ["思っていることを、そのまま言葉に出すこと。", "会話の途中に割り込んで、意見を言うこと。"], "id": "w38"}, {"phrase": "猿も木から落ちる", "reading": "さるもきからおちる", "meaning": "その道の名人でも、時には失敗することがあるということ。", "example": "名人でも失敗するとは、まさに猿も木から落ちるだ。", "distractorMeanings": ["幼いころの性格は、年をとっても変わらないということ。", "二つのものを同時に狙って、結局両方失敗すること。"], "id": "w39"}, {"phrase": "手を貸す", "reading": "てをかす", "meaning": "他人の仕事や作業を手伝うこと。", "example": "重い荷物を運ぶのに、友達が手を貸してくれた。", "distractorMeanings": ["扱いに困り、対応に苦労すること。", "自分の力では、とても処理しきれないこと。"], "id": "w40"}, {"phrase": "ぬかに釘", "reading": "ぬかにくぎ", "meaning": "いくら意見をしても、何の手ごたえも効き目もないことのたとえ。", "example": "何度注意しても、ぬかに釘でまったく直らない。", "distractorMeanings": ["忠告をしても、まったく聞き入れようとしないこと。", "わずかな努力では、大きな変化が見られないこと。"], "id": "w41"}, {"phrase": "のれんに腕押し", "reading": "のれんにうでおし", "meaning": "手ごたえがなく、いくら働きかけても効果がないことのたとえ。", "example": "彼にはいくら言っても、のれんに腕押しでまったく響かない。", "distractorMeanings": ["二つの利益を同時に狙って、結局どちらも失敗すること。", "価値のわからない人には、貴重なものも無意味だということ。"], "id": "w42"}, {"phrase": "鼻が高い", "reading": "はながたかい", "meaning": "得意になって、誇らしく思うこと。", "example": "息子が表彰されて、母親は鼻が高かった。", "distractorMeanings": ["自信を持って、堂々とした態度をとること。", "多くの人と知り合いで、交際範囲が広いこと。"], "id": "w43"}, {"phrase": "どんぐりの背比べ", "reading": "どんぐりのせいくらべ", "meaning": "どれも似たり寄ったりで、特別優れたものがないこと。", "example": "今回の作品はどんぐりの背比べで、優劣がつけにくい。", "distractorMeanings": ["二つのものを同時に得ようとして、両方とも失敗すること。", "どんなに得意なことでも、時には失敗することがあるということ。"], "id": "w44"}, {"phrase": "腹を割る", "reading": "はらをわる", "meaning": "本心をかくさずに、すべて打ち明けること。", "example": "友達と腹を割って、じっくり話し合った。", "distractorMeanings": ["怒りをおさえきれず、感情を表に出すこと。", "相手の話を、注意深く熱心に聞くこと。"], "id": "w45"}, {"phrase": "百聞は一見に如かず", "reading": "ひゃくぶんはいっけんにしかず", "meaning": "何度も人から聞くより、一度自分の目で見る方がよくわかるということ。", "example": "写真より実物を見た方がいいよ、百聞は一見に如かずだから。", "distractorMeanings": ["用心の上にも用心を重ねて、物事を行うべきだということ。", "急ぐときほど、確実で安全な方法を選ぶべきだということ。"], "id": "w46"}, {"phrase": "耳が痛い", "reading": "みみがいたい", "meaning": "自分の欠点を言われて、聞くのがつらいこと。", "example": "母の小言は耳が痛いが、正しいことばかりだ。", "distractorMeanings": ["思いがけない知らせに、非常に驚くこと。", "忠告を聞いても、まったく効き目がないこと。"], "id": "w47"}, {"phrase": "顔から火が出る", "reading": "かおからひがでる", "meaning": "恥ずかしさのあまり、顔が真っ赤になること。", "example": "人前で名前を間違えられ、顔から火が出るほど恥ずかしかった。", "distractorMeanings": ["驚きのあまり、思わず言葉を失ってしまうこと。", "悔しさをじっとこらえて、我慢すること。"], "id": "w48"}, {"phrase": "油を売る", "reading": "あぶらをうる", "meaning": "仕事の途中でむだ話をしたり、なまけたりすること。", "example": "買い物の帰りに油を売っていて、遅くなってしまった。", "distractorMeanings": ["休む間もなく、忙しく立ち働くこと。", "人にうまく取り入って、利益を得ようとすること。"], "id": "w49"}, {"phrase": "耳にする", "reading": "みみにする", "meaning": "話や音を、たまたま聞くこと。", "example": "教室でうわさを耳にして、少し驚いた。", "distractorMeanings": ["注意深く、熱心に人の話を聞くこと。", "人の忠告を、素直に受け入れること。"], "id": "w50"}, {"phrase": "肩を落とす", "reading": "かたをおとす", "meaning": "がっかりして、元気をなくすこと。", "example": "試合に負けて、彼は肩を落として帰った。", "distractorMeanings": ["得意になって、誇らしく思うこと。", "恥ずかしさのあまり、顔が真っ赤になること。"], "id": "w51"}, {"phrase": "目にする", "reading": "めにする", "meaning": "あるものを、たまたま見ること。", "example": "街で有名人の姿を目にした。", "distractorMeanings": ["話や音を、たまたま聞くこと。", "驚いたり感動したりして、一瞬息を止めること。"], "id": "w52"}, {"phrase": "目をみはる", "reading": "めをみはる", "meaning": "驚いたり感心したりして、目を大きく見開くこと。", "example": "見事な演技に、観客はみな目をみはった。", "distractorMeanings": ["うれしさのあまり、思わずほほえむこと。", "不快に思って、顔をしかめること。"], "id": "w53"}, {"phrase": "首を長くする", "reading": "くびをながくする", "meaning": "今か今かと、心待ちにして待ち望むこと。", "example": "プレゼントが届くのを、首を長くして待った。", "distractorMeanings": ["疑問に思い、なかなか納得できないこと。", "得意になって、誇らしく思うこと。"], "id": "w54"}, {"phrase": "鶴の一声", "reading": "つるのひとこえ", "meaning": "多くの意見をおさえてまとめてしまう、権威者の一言。", "example": "会議はもめていたが、社長の鶴の一声で決まった。", "distractorMeanings": ["つかえることなく、すらすらと話すことのたとえ。", "意見や忠告をしても、まったく効き目がないこと。"], "id": "w55"}, {"phrase": "足が出る", "reading": "あしがでる", "meaning": "予算や収入よりも、支出のほうが多くなること。", "example": "旅行の費用がかさんで、思わず足が出てしまった。", "distractorMeanings": ["他人の物事の進行を、邪魔してしまうこと。", "自分の力では、とても処理しきれないこと。"], "id": "w56"}, {"phrase": "情けは人のためならず", "reading": "なさけはひとのためならず", "meaning": "人に親切にすれば、いずれ自分に良い報いが返ってくるということ。", "example": "情けは人のためならずというから、困っている人を助けようと思う。", "distractorMeanings": ["もめごとの後は、かえって物事が良い方向に安定するということ。", "人に親切にすると、その人を甘やかすことになるということ。"], "id": "w57"}, {"phrase": "二の足を踏む", "reading": "にのあしをふむ", "meaning": "決心がつかず、ためらってしまうこと。", "example": "値段の高さに、買おうかどうか二の足を踏んでしまった。", "distractorMeanings": ["決心がつかないまま、同じ失敗を繰り返してしまうこと。", "予算よりも、支出のほうが多くなってしまうこと。"], "id": "w58"}, {"phrase": "猫の額", "reading": "ねこのひたい", "meaning": "場所や土地が、非常に狭いことのたとえ。", "example": "うちの庭は猫の額ほどの広さしかない。", "distractorMeanings": ["価値がわからない人には、貴重なものも無意味だということ。", "どれも似たり寄ったりで、特別優れたものがないこと。"], "id": "w59"}, {"phrase": "歯が立たない", "reading": "はがたたない", "meaning": "相手が強すぎて、とても対抗できないこと。", "example": "強豪チームが相手では、まったく歯が立たなかった。", "distractorMeanings": ["自分の力では、とても処理しきれないこと。", "用心の上にも用心を重ねて、物事を行うこと。"], "id": "w60"}, {"phrase": "耳を貸す", "reading": "みみをかす", "meaning": "人の話を、進んで聞こうとすること。", "example": "友達の悩みに、しっかりと耳を貸した。", "distractorMeanings": ["話や音を、たまたま聞いてしまうこと。", "忠告をしても、まったく効き目がないこと。"], "id": "w61"}, {"phrase": "枯れ木も山のにぎわい", "reading": "かれきもやまのにぎわい", "meaning": "つまらないものでも、無いよりはあった方がにぎやかで良いということ。", "example": "枯れ木も山のにぎわいというし、少人数でも参加してくれると助かる。", "distractorMeanings": ["どれも似たり寄ったりで、特別優れたものがないこと。", "つまらないものでも、数が多ければ立派に見えるということ。"], "id": "w62"}, {"phrase": "途方に暮れる", "reading": "とほうにくれる", "meaning": "どうしてよいかわからず、困り果ててしまうこと。", "example": "道に迷ってしまい、すっかり途方に暮れた。", "distractorMeanings": ["決心がつかず、ためらってしまうこと。", "がっかりして、元気をなくしてしまうこと。"], "id": "w63"}, {"phrase": "歯に衣着せぬ", "reading": "はにきぬをきせぬ", "meaning": "相手に対して、思ったことを遠慮せずに率直に言うこと。", "example": "彼は歯に衣着せぬ物言いで有名だ。", "distractorMeanings": ["うわさや秘密を、こっそり人に広めてしまうこと。", "会話の途中に割り込んで、意見を言うこと。"], "id": "w64"}, {"phrase": "かわいい子には旅をさせよ", "reading": "かわいいこにはたびをさせよ", "meaning": "子供を甘やかさず、あえて苦労を経験させた方が成長するということ。", "example": "かわいい子には旅をさせよというので、一人でお使いに行かせてみた。", "distractorMeanings": ["幼いころの性格は、大人になっても変わらないということ。", "人に親切にすれば、いずれ自分に良い報いが返るということ。"], "id": "w65"}, {"phrase": "気が置けない", "reading": "きがおけない", "meaning": "遠慮や気づかいが必要なく、心から打ち解けられること。", "example": "彼とは気が置けない仲で、何でも気軽に話せる。", "distractorMeanings": ["油断ができず、常に警戒しておく必要があるということ。", "気持ちや性格が合い、気の合う仲であること。"], "id": "w66"}, {"phrase": "釘を刺す", "reading": "くぎをさす", "meaning": "あとで問題が起きないように、あらかじめ念を押しておくこと。", "example": "遅刻しないようにと、前もって釘を刺しておいた。", "distractorMeanings": ["相手の言動に不満を持ち、強く注意すること。", "いくら働きかけても、まったく手ごたえがないこと。"], "id": "w67"}, {"phrase": "立つ鳥跡をにごさず", "reading": "たつとりあとをにごさず", "meaning": "立ち去る者は、後始末をきちんとしてから去るべきだということ。", "example": "立つ鳥跡を濁さずで、部屋をきれいに片付けてから引っ越した。", "distractorMeanings": ["どうしてよいかわからず、困り果ててしまうこと。", "つまらないものでも、無いよりはあった方が良いということ。"], "id": "w68"}, {"phrase": "二階から目薬", "reading": "にかいからめぐすり", "meaning": "物事が思うようにならず、もどかしくて効き目が薄いことのたとえ。", "example": "遠くから口で指示するだけでは、二階から目薬でうまくいかない。", "distractorMeanings": ["少しばかりの助けや努力では、ほとんど効果がないこと。", "忠告をしても、まったく効き目がないこと。"], "id": "w69"}, {"phrase": "仏の顔も三度", "reading": "ほとけのかおもさんど", "meaning": "どんなに温和な人でも、何度もひどい仕打ちをされれば怒るということ。", "example": "仏の顔も三度というし、優しい先生でもそろそろ怒るだろう。", "distractorMeanings": ["急ぐときほど、確実で安全な方法を選ぶべきだということ。", "立ち去るときは、後始末をきちんとするべきだということ。"], "id": "w70"}, {"phrase": "耳を疑う", "reading": "みみをうたがう", "meaning": "思いがけないことを聞いて、本当かどうか信じられない気持ちになること。", "example": "合格したという知らせを聞いて、思わず耳を疑った。", "distractorMeanings": ["自分の欠点を言われて、聞くのがつらいこと。", "忠告をしても、まったく効き目がないこと。"], "id": "w71"}, {"phrase": "気にする", "reading": "きにする", "meaning": "心配したり、こだわったりすること。", "example": "小さな失敗をいつまでも気にしてしまう。", "distractorMeanings": ["今まで気づかなかったことに、はっと気づくこと。", "遠慮せずに、心から打ち解けられる間柄であること。"], "id": "w72"}, {"phrase": "後の祭り", "reading": "あとのまつり", "meaning": "時期が過ぎてしまい、今さら何をしても手遅れであること。", "example": "準備を怠って失敗したが、今さら悔やんでも後の祭りだ。", "distractorMeanings": ["どうしてよいかわからず、困り果ててしまうこと。", "もめごとの後は、かえって物事が良い方向に安定するということ。"], "id": "w73"}, {"phrase": "急がば回れ", "reading": "いそがばまわれ", "meaning": "急ぐときほど、危険な近道より確実な方法を選ぶ方が結局早いということ。", "example": "急がば回れというから、慣れた安全な道を選んで行こう。", "distractorMeanings": ["つらくても、がまん強く続ければ必ず成功するということ。", "何度も人から聞くより、一度自分の目で見る方がよくわかるということ。"], "id": "w74"}, {"phrase": "口をはさむ", "reading": "くちをはさむ", "meaning": "他人の話の途中に割り込んで、発言すること。", "example": "大人同士の話に、子供が口をはさむものではない。", "distractorMeanings": ["言葉を話すこと。また、人と人の仲を取り持つこと。", "不満そうな顔つきをすること。"], "id": "w75"}, {"phrase": "漁夫の利", "reading": "ぎょふのり", "meaning": "両者が争っている間に、関係のない第三者が苦労せず利益を得ること。", "example": "兄弟がけんかしている間に妹がお菓子を食べてしまい、漁夫の利だった。", "distractorMeanings": ["苦労せずに大きな利益を得ようとして、かえって失敗すること", "仲の良い者同士が協力して利益を分け合うこと"], "id": "w76"}, {"phrase": "千里の道も一歩から", "reading": "せんりのみちもいっぽから", "meaning": "どんなに大きな物事も、小さな第一歩の積み重ねから始まるということ。", "example": "千里の道も一歩からと思って、毎日少しずつ漢字を覚えている。", "distractorMeanings": ["遠くの目標より、まず身近なことを大事にすべきだということ", "一度始めたことは、最後までやり遂げるべきだということ"], "id": "w77"}, {"phrase": "下手の横好き", "reading": "へたのよこずき", "meaning": "上手ではないのに、それが好きで熱心に取り組んでいること。", "example": "絵は下手の横好きだけれど、毎日楽しく描いている。", "distractorMeanings": ["得意なことばかりに時間を使い、苦手を避けてしまうこと", "才能がないことにすぐ気づいて、あきらめてしまうこと"], "id": "w78"}, {"phrase": "水に流す", "reading": "みずにながす", "meaning": "過去のいざこざやもめごとを、なかったことにして許すこと。", "example": "けんかのことはもう水に流して、また仲良くしよう。", "distractorMeanings": ["大切な思い出を忘れないように、心に刻んでおくこと", "悪いうわさをそのまま人に伝えてしまうこと"], "id": "w79"}, {"phrase": "耳をすます", "reading": "みみをすます", "meaning": "音をよく聞き取ろうと、注意深く耳を傾けること。", "example": "森の中で耳をすますと、小鳥の鳴き声が聞こえた。", "distractorMeanings": ["人の話を疑いながら、注意深く聞くこと", "聞きたくない話を、聞こえないふりをすること"], "id": "w80"}, {"phrase": "目につく", "reading": "めにつく", "meaning": "目立って、自然と気づいたり印象に残ったりすること。", "example": "彼女がかぶっている赤い帽子はとても目につく。", "distractorMeanings": ["見たものを、すぐに忘れてしまうこと", "物事の悪い点ばかりを探して指摘すること"], "id": "w81"}, {"phrase": "相づちを打つ", "reading": "あいづちをうつ", "meaning": "相手の話に合わせて、うなずいたり短く返事をしたりすること。", "example": "友達の話に相づちを打ちながら聞いた。", "distractorMeanings": ["相手の意見に強く反対して、言い返すこと", "話の内容を細かく確認するために質問すること"], "id": "w82"}, {"phrase": "足を洗う", "reading": "あしをあらう", "meaning": "悪い仲間や良くない生活から、きっぱりと抜け出すこと。", "example": "彼は不良グループから足を洗って、まじめに勉強を始めた。", "distractorMeanings": ["長い旅から帰って、ゆっくり体を休めること", "疲れた体を休めて、元気を取り戻すこと"], "id": "w83"}, {"phrase": "頭が下がる", "reading": "あたまがさがる", "meaning": "相手の立派な行いに、心から感心し尊敬すること。", "example": "毎日休まず働くお父さんには頭が下がる。", "distractorMeanings": ["恥ずかしくて、人前に出られなくなること", "疲れてしまい、やる気がなくなること"], "id": "w84"}, {"phrase": "帯に短したすきに長し", "reading": "おびにみじかしたすきにながし", "meaning": "中途半端で、どちらの目的にも使いにくく役に立たないこと。", "example": "このひもは帯に短したすきに長しで、結局使わなかった。", "distractorMeanings": ["二つのうち、どちらを選んでも良い結果になるということ", "物がたくさんありすぎて、選ぶのに迷ってしまうこと"], "id": "w85"}, {"phrase": "顔をしかめる", "reading": "かおをしかめる", "meaning": "不快なことや痛みを感じて、まゆをよせて嫌な顔をすること。", "example": "苦い薬を飲んで、思わず顔をしかめた。", "distractorMeanings": ["うれしさのあまり、思わず笑顔になること", "驚いて、目を大きく見開くこと"], "id": "w86"}, {"phrase": "肩をすくめる", "reading": "かたをすくめる", "meaning": "困ったときやあきれたときに、両肩を上げて見せるしぐさ。", "example": "質問に答えられず、彼は肩をすくめた。", "distractorMeanings": ["相手に賛成する気持ちを、態度で表すこと", "緊張して、体をこわばらせること"], "id": "w87"}, {"phrase": "能ある鷹は爪を隠す", "reading": "のうあるたかはつめをかくす", "meaning": "本当に実力のある人は、それをひけらかさず控えめにしているということ。", "example": "彼はとても優秀なのに自慢しない、まさに能ある鷹は爪を隠すだ。", "distractorMeanings": ["危険な相手には、正体を見せないよう用心すべきだということ", "力のある者ほど、他人を厳しく評価するということ"], "id": "w88"}, {"phrase": "木に竹を接ぐ", "reading": "きにたけをつぐ", "meaning": "性質の違うものを無理に組み合わせて、ちぐはぐになること。", "example": "この文章は前後で話がつながらず、木に竹を接いだようだ。", "distractorMeanings": ["古いものを大切に直しながら、長く使い続けること", "二つの良い点を組み合わせて、より良いものにすること"], "id": "w89"}, {"phrase": "鼻にかける", "reading": "はなにかける", "meaning": "自分の能力や持ち物を、自慢げに得意になること。", "example": "テストで満点を取ったことを鼻にかけている。", "distractorMeanings": ["人の意見を軽くあつかい、相手にしないこと", "相手の失敗を、こっそり喜ぶこと"], "id": "w90"}, {"phrase": "鼻につく", "reading": "はなにつく", "meaning": "同じことが続いて嫌になり、うっとうしく感じること。", "example": "彼の自慢話が鼻について、もう聞きたくない。", "distractorMeanings": ["良い香りが漂ってきて、気分が良くなること", "相手の言うことに、すぐ納得してしまうこと"], "id": "w91"}, {"phrase": "耳にたこができる", "reading": "みみにたこができる", "meaning": "同じことを何度も聞かされて、うんざりすること。", "example": "早く寝なさいと耳にたこができるほど言われた。", "distractorMeanings": ["大事な話を聞き逃さないよう、集中すること", "初めて聞く話に、強く興味を持つこと"], "id": "w92"}, {"phrase": "耳をそろえる", "reading": "みみをそろえる", "meaning": "必要なお金を全部きちんとそろえて、用意すること。", "example": "借りたお金は耳をそろえて返した。", "distractorMeanings": ["大勢の意見をまとめて、一つにすること", "相手の言葉に、注意深く耳を傾けること"], "id": "w93"}, {"phrase": "弱り目にたたり目", "reading": "よわりめにたたりめ", "meaning": "困っているときに、さらに悪いことが重なって起こること。", "example": "財布を落とした上に雨にも降られ、弱り目にたたり目だった。", "distractorMeanings": ["悪いことのあとには、必ず良いことが起こるということ", "一度失敗した人は、二度と同じ失敗をしないということ"], "id": "w94"}, {"phrase": "言わぬが花", "reading": "いわぬがはな", "meaning": "はっきり言わない方が、かえって趣があってよいということ。", "example": "その理由は言わぬが花だよ。", "distractorMeanings": ["本当に大切なことは、はっきり伝えるべきだということ", "きれいな言葉より、行動で示すべきだということ"], "id": "w95"}, {"phrase": "一目置く", "reading": "いちもくおく", "meaning": "相手の実力を認めて、敬意をもって一歩ゆずること。", "example": "クラスの誰もが彼の実力に一目置いている。", "distractorMeanings": ["相手を警戒して、距離を置くこと", "自分の意見を主張せず、黙って従うこと"], "id": "w96"}, {"phrase": "転ばぬ先のつえ", "reading": "ころばぬさきのつえ", "meaning": "失敗しないように、前もって用心し準備しておくこと。", "example": "転ばぬ先のつえで、傘を持って出かけた。", "distractorMeanings": ["失敗してもあきらめず、何度も挑戦すること", "危険なことには、最初から関わらないようにすること"], "id": "w97"}, {"phrase": "朱に交われば赤くなる", "reading": "しゅにまじわればあかくなる", "meaning": "人は付き合う相手や環境によって、良くも悪くも影響されるということ。", "example": "朱に交われば赤くなるというから、友達選びは大切だ。", "distractorMeanings": ["良いものと悪いものが混ざると、全体が悪くなるということ", "一度身についた性格は、簡単には変わらないということ"], "id": "w98"}, {"phrase": "背に腹は代えられぬ", "reading": "せにはらはかえられぬ", "meaning": "大事な物事を守るためには、多少の犠牲もやむを得ないということ。", "example": "背に腹は代えられず、貯金を崩して修理代を払った。", "distractorMeanings": ["どちらも同じくらい大切で、選ぶことができないこと", "苦しくても、我慢して耐え続けるべきだということ"], "id": "w99"}, {"phrase": "棚からぼたもち", "reading": "たなからぼたもち", "meaning": "思いがけない幸運が、努力もせずに転がり込んでくること。", "example": "抽選で一等が当たるなんて、棚からぼたもちだ。", "distractorMeanings": ["苦労して手に入れたものほど、価値があるということ", "欲張ると、持っているものまで失ってしまうこと"], "id": "w100"}, {"phrase": "泣き面にはち", "reading": "なきつらにはち", "meaning": "困っているときに、さらに別の災難が重なって起こること。", "example": "遅刻した上に忘れ物もして、泣き面にはちだった。", "distractorMeanings": ["悪いことのあとには、必ず良い報いがあるということ", "一つの心配事のせいで、他のことが手につかなくなること"], "id": "w101"}, {"phrase": "猫をかぶる", "reading": "ねこをかぶる", "meaning": "本当の性格を隠して、おとなしそうなふりをすること。", "example": "彼女は初対面のときは猫をかぶっていた。", "distractorMeanings": ["人のまねをして、得意になっていること", "危険から身を隠して、じっとしていること"], "id": "w102"}, {"phrase": "花より団子", "reading": "はなよりだんご", "meaning": "見た目の美しさより、実際に役立つものの方がよいということ。", "example": "花見に来たのに、花より団子でお弁当ばかり食べていた。", "distractorMeanings": ["見た目が美しいものほど、価値があるということ", "何事も、無駄なく効率よく行うべきだということ"], "id": "w103"}, {"phrase": "的を得る", "reading": "まとをえる", "meaning": "話や指摘が、要点を正確にとらえていること。", "example": "彼の意見はいつも的を得ている。", "distractorMeanings": ["目標に向かって、一生懸命努力すること", "多くの中から、一番良いものを選び出すこと"], "id": "w104"}, {"phrase": "胸をなで下ろす", "reading": "むねをなでおろす", "meaning": "心配していたことが解決して、ほっと安心すること。", "example": "探していた財布が見つかり、胸をなで下ろした。", "distractorMeanings": ["悲しみをこらえて、気持ちを落ち着けること", "相手を気づかって、優しく声をかけること"], "id": "w105"}, {"phrase": "目からうろこが落ちる", "reading": "めからうろこがおちる", "meaning": "何かがきっかけで、急に物事の本質がよく分かるようになること。", "example": "先生の説明を聞いて、目からうろこが落ちた。", "distractorMeanings": ["疲れて、目が開けられないほど眠くなること", "悲しみのあまり、涙が止まらなくなること"], "id": "w106"}, {"phrase": "目を背ける", "reading": "めをそむける", "meaning": "見るのがつらいことから、目をそらして見ないようにすること。", "example": "悲惨な事故現場から、思わず目を背けた。", "distractorMeanings": ["興味のあるものを、じっと見つめ続けること", "相手の顔色をうかがいながら、話すこと"], "id": "w107"}, {"phrase": "意を決する", "reading": "いをけっする", "meaning": "迷いを断ち切り、思い切って心を決めること。", "example": "意を決して、苦手な発表に挑戦した。", "distractorMeanings": ["相手の考えを推し量って、先回りすること", "物事の結果を、じっくり待つこと"], "id": "w108"}, {"phrase": "魚心あれば水心", "reading": "うおごころあればみずごころ", "meaning": "相手が好意を示せば、こちらも好意で応じようという気になるということ。", "example": "魚心あれば水心で、親切にしてくれた人には自分も親切にしたい。", "distractorMeanings": ["環境が変われば、そこに慣れて暮らせるということ", "似た者同士は、自然と集まるということ"], "id": "w109"}, {"phrase": "狐につままれる", "reading": "きつねにつままれる", "meaning": "何が起きたのか分からず、ぼんやりと不思議な気持ちになること。", "example": "置いたはずの物が消えていて、狐につままれたようだった。", "distractorMeanings": ["相手にだまされて、大きな損をしてしまうこと", "恐怖で体がすくんで、動けなくなること"], "id": "w110"}, {"phrase": "木で鼻をくくる", "reading": "きではなをくくる", "meaning": "相手の頼みなどに、そっけなく冷たい態度で対応すること。", "example": "質問したのに、木で鼻をくくったような返事しかもらえなかった。", "distractorMeanings": ["道理に合わないことを、無理に押し通すこと", "見た目だけを整えて、中身をごまかすこと"], "id": "w111"}, {"phrase": "高をくくる", "reading": "たかをくくる", "meaning": "大したことはないと、物事を軽く見て油断すること。", "example": "簡単な問題だと高をくくっていたら、間違えてしまった。", "distractorMeanings": ["相手の実力を認めて、敬意を払うこと", "用心深く、前もって準備をしておくこと"], "id": "w112"}, {"phrase": "鬼の目にも涙", "reading": "おにのめにもなみだ", "meaning": "ふだんは冷酷に見える人でも、時には人情や涙を見せることがあるということ。", "example": "あの厳しい先生が生徒の作文で涙ぐんだ、鬼の目にも涙だ。", "distractorMeanings": ["どんなに辛い状況でも、我慢して涙を見せないこと", "悪いことをした人には、必ず罰が下るということ"], "id": "w113"}, {"phrase": "すずめの涙", "reading": "すずめのなみだ", "meaning": "量がとても少なく、わずかしかないことのたとえ。", "example": "お小遣いはすずめの涙ほどしかもらえなかった。", "distractorMeanings": ["小さな体でも、大きな力を発揮すること", "弱い立場の者が声をあげても、届かないこと"], "id": "w114"}, {"phrase": "竹馬の友", "reading": "ちくばのとも", "meaning": "子どもの頃から一緒に遊んで育った、仲の良い友人のこと。", "example": "彼とは竹馬の友で、今でも仲がいい。", "distractorMeanings": ["苦しい時を共に乗り越えた、大切な仲間のこと", "利害だけでつながっている、表面的な友人のこと"], "id": "w115"}, {"phrase": "手塩にかける", "reading": "てしおにかける", "meaning": "自分で苦労しながら、大切に世話をして育て上げること。", "example": "手塩にかけて育てた息子が、立派に成長した。", "distractorMeanings": ["他人に任せず、自分の力だけで解決すること", "大切なものを、人に見せずに隠しておくこと"], "id": "w116"}, {"phrase": "手に入る", "reading": "てにはいる", "meaning": "欲しかった物が、自分のものになること。", "example": "念願のチケットが、ようやく手に入った。", "distractorMeanings": ["苦労の末に、ようやく目標を達成すること", "相手の弱点を、うまく利用すること"], "id": "w117"}, {"phrase": "出る杭は打たれる", "reading": "でるくいはうたれる", "meaning": "人より目立って優れていると、周りから妬まれ攻撃されやすいということ。", "example": "出る杭は打たれるというが、彼の活躍はねたまれることもあった。", "distractorMeanings": ["実力のある人は、いずれ必ず認められるということ", "何もしない人は、周りから信用されないということ"], "id": "w118"}, {"phrase": "手をこまねく", "reading": "てをこまねく", "meaning": "何もせずに、ただ傍観していること。", "example": "助ける方法が分からず、手をこまねいて見ているしかなかった。", "distractorMeanings": ["忙しくて、休む暇もなく働き続けること", "相手の出方を、じっと待って様子をうかがうこと"], "id": "w119"}, {"phrase": "猫の手も借りたい", "reading": "ねこのてもかりたい", "meaning": "とても忙しく、誰でもいいから手伝ってほしいと思うこと。", "example": "引っ越し当日は猫の手も借りたいほど忙しかった。", "distractorMeanings": ["誰の助けも借りず、自分一人でやり遂げたいこと", "手先が器用で、どんな仕事も上手にこなせること"], "id": "w120"}, {"phrase": "濡れ手で粟", "reading": "ぬれてであわ", "meaning": "苦労せずに、簡単に大きな利益を得ること。", "example": "掘り出し物を安く売ったら高値がつき、濡れ手で粟のもうけだった。", "distractorMeanings": ["こつこつ努力を重ねて、成果を得ること", "お金を使いすぎて、すぐになくなってしまうこと"], "id": "w121"}, {"phrase": "念を押す", "reading": "ねんをおす", "meaning": "間違いがないように、もう一度確かめて注意すること。", "example": "待ち合わせの時間を念を押して確認した。", "distractorMeanings": ["相手の言葉を疑わず、そのまま信じること", "一度決めたことを、絶対に変えないこと"], "id": "w122"}, {"phrase": "鼻で笑う", "reading": "はなでわらう", "meaning": "相手を見下して、ばかにしたように笑うこと。", "example": "彼の言い訳を鼻で笑って聞き流した。", "distractorMeanings": ["恥ずかしさを隠すために、愛想笑いをすること", "面白い話を聞いて、心から楽しく笑うこと"], "id": "w123"}, {"phrase": "鼻を明かす", "reading": "はなをあかす", "meaning": "相手を出し抜いて、あっと驚かせやり込めること。", "example": "いつも自慢する兄の鼻を明かしてやろうと頑張った。", "distractorMeanings": ["相手の自慢を、素直に認めてほめること", "隠していた秘密を、うっかり話してしまうこと"], "id": "w124"}, {"phrase": "腹をくくる", "reading": "はらをくくる", "meaning": "結果がどうであれ引き受けようと、覚悟を決めること。", "example": "失敗してもいいと腹をくくって、発表に臨んだ。", "distractorMeanings": ["怒りをおさえて、表情に出さないようにすること", "相手の言うことに逆らわず、従うこと"], "id": "w125"}, {"phrase": "目を輝かせる", "reading": "めをかがやかせる", "meaning": "期待や喜びで、目を生き生きと輝かせること。", "example": "プレゼントを見て、子どもは目を輝かせた。", "distractorMeanings": ["恐怖で、顔が青ざめてしまうこと", "疲れて、眠そうに目を細めること"], "id": "w126"}, {"phrase": "目をこらす", "reading": "めをこらす", "meaning": "よく見えるように、じっと集中して見つめること。", "example": "暗闇の中、目をこらして足元を確認した。", "distractorMeanings": ["見たくないものから、顔をそむけること", "興味のないことに、ぼんやり目を向けること"], "id": "w127"}, {"phrase": "顔に泥を塗る", "reading": "かおにどろをぬる", "meaning": "相手の名誉を傷つけ、恥をかかせること。", "example": "約束を破って、先生の顔に泥を塗ってしまった。", "distractorMeanings": ["自分の失敗を隠すために、嘘をつくこと", "相手のために、自分を犠牲にして尽くすこと"], "id": "w128"}, {"phrase": "一を聞いて十を知る", "reading": "いちをきいてじゅうをしる", "meaning": "少し聞いただけで、物事の全体をすぐに理解する賢さのこと。", "example": "彼女は一を聞いて十を知るタイプで、説明はいつも一言で済む。", "distractorMeanings": ["一度覚えたことは、決して忘れないということ", "何事も、最初が肝心だということ"], "id": "w129"}, {"phrase": "類は友を呼ぶ", "reading": "るいはともをよぶ", "meaning": "似た性質や趣味を持つ者同士は、自然と集まるということ。", "example": "あの二人が仲がいいのは、類は友を呼ぶからだろう。", "distractorMeanings": ["良い友人を持つと、自分も成長できるということ", "環境が、人の性格を作り上げるということ"], "id": "w130"}, {"phrase": "足を運ぶ", "reading": "あしをはこぶ", "meaning": "わざわざその場所まで、実際に出向いて行くこと。", "example": "何度も図書館に足を運んで、資料を調べた。", "distractorMeanings": ["悪い仲間から、きっぱり離れること", "忙しく動き回って、働くこと"], "id": "w131"}, {"phrase": "医者の不養生", "reading": "いしゃのふようじょう", "meaning": "人には立派なことを言うのに、自分では実行できていないこと。", "example": "早寝早起きをすすめる先生が夜更かしばかり、医者の不養生だ。", "distractorMeanings": ["専門家ほど、基本を大切にするということ", "忙しい人ほど、体調をくずしやすいということ"], "id": "w132"}, {"phrase": "口がかたい", "reading": "くちがかたい", "meaning": "秘密をしっかり守って、他人に話さないこと。", "example": "彼は口がかたいから、悩みを相談しても安心だ。", "distractorMeanings": ["自分の意見をはっきり言わず、遠慮すること", "頑固で、人の意見を聞き入れないこと"], "id": "w133"}, {"phrase": "首を横にふる", "reading": "くびをよこにふる", "meaning": "賛成できないという気持ちを、首を振って示すこと。", "example": "提案に対して、彼は黙って首を横にふった。", "distractorMeanings": ["納得して、相手の意見に同意すること", "疲れて、眠気をこらえること"], "id": "w134"}, {"phrase": "五十歩百歩", "reading": "ごじっぽひゃっぽ", "meaning": "少しの違いはあっても、本質的にはほとんど同じであるということ。", "example": "30点と35点、どちらも五十歩百歩の悪さだ。", "distractorMeanings": ["どちらを選んでも、大きな得はないということ", "努力を続ければ、いつか差がつくということ"], "id": "w135"}, {"phrase": "好きこそものの上手なれ", "reading": "すきこそもののじょうずなれ", "meaning": "好きなことは熱心に取り組むので、自然と上達するということ。", "example": "好きこそものの上手なれで、彼はプログラミングがどんどん上手になった。", "distractorMeanings": ["苦手なことほど、克服する価値があるということ", "上手になるには、才能が一番大切だということ"], "id": "w136"}, {"phrase": "筋が通る", "reading": "すじがとおる", "meaning": "話や考え方に矛盾がなく、道理にかなっていること。", "example": "彼の説明は筋が通っていて、納得できた。", "distractorMeanings": ["相手の意見に反論せず、素直に従うこと", "物事を最後までやり通す、強い意志のこと"], "id": "w137"}, {"phrase": "すずめ百まで踊り忘れず", "reading": "すずめひゃくまでおどりわすれず", "meaning": "小さい頃に身についた習慣や性質は、年をとっても変わらないということ。", "example": "すずめ百まで踊り忘れずで、幼い頃好きだった絵を今も描き続けている。", "distractorMeanings": ["年をとるほど、新しいことを覚えにくくなるということ", "小さな努力の積み重ねが、大きな結果になるということ"], "id": "w138"}, {"phrase": "住めば都", "reading": "すめばみやこ", "meaning": "どんな場所でも、住み慣れれば居心地がよく思えてくるということ。", "example": "田舎に引っ越したが、住めば都で今はとても気に入っている。", "distractorMeanings": ["都会が、一番暮らしやすい場所だということ", "新しい環境には、すぐ慣れるものだということ"], "id": "w139"}, {"phrase": "月とすっぽん", "reading": "つきとすっぽん", "meaning": "見た目は似ていても、比べものにならないほど差があること。", "example": "二人の絵の実力は月とすっぽんだ。", "distractorMeanings": ["仲が悪く、いつもけんかばかりしている間柄のこと", "二つとも同じくらい優れていて、優劣がつけがたいこと"], "id": "w140"}, {"phrase": "手が込む", "reading": "てがこむ", "meaning": "作り方がとても複雑で、細かい工夫がされていること。", "example": "この刺しゅうは手が込んでいて、仕上げに時間がかかった。", "distractorMeanings": ["準備不足で、ものごとが雑になってしまうこと", "簡単な作業を、わざと難しく見せかけること"], "id": "w141"}, {"phrase": "捕らぬ狸の皮算用", "reading": "とらぬたぬきのかわざんよう", "meaning": "まだ手に入っていないものを当てにして、計画を立てること。", "example": "宝くじが当たったら何を買おうかなんて、捕らぬ狸の皮算用だ。", "distractorMeanings": ["手に入れたものを、大切に使わず無駄にすること", "危険を避けるために、慎重に準備をしておくこと"], "id": "w142"}, {"phrase": "虎の威を借る狐", "reading": "とらのいをかるきつね", "meaning": "自分に力がないのに、強い者の力を借りていばること。", "example": "部長の名前を出していばる彼は、まさに虎の威を借る狐だ。", "distractorMeanings": ["弱い者同士が協力して、強い相手に立ち向かうこと", "本当の実力者は、自分の力を隠しているということ"], "id": "w143"}, {"phrase": "手に負えない", "reading": "てにおえない", "meaning": "自分の力では対応できないほど、扱いが難しいこと。", "example": "弟のいたずらは、手に負えないほどひどくなった。", "distractorMeanings": ["苦労して、ようやく目的のものを手に入れること", "忙しくて、他のことに手が回らないこと"], "id": "w144"}, {"phrase": "手を打つ", "reading": "てをうつ", "meaning": "問題が起きないように、前もって対策をとること。", "example": "トラブルになる前に、早めに手を打っておいた。", "distractorMeanings": ["相手の意見に賛成して、拍手をすること", "仕事を途中で投げ出して、あきらめること"], "id": "w145"}, {"phrase": "七転び八起き", "reading": "ななころびやおき", "meaning": "何度失敗してもくじけず、そのたびに立ち直り頑張ること。", "example": "七転び八起きの精神で、あきらめずに練習を続けた。", "distractorMeanings": ["一度の失敗も許されない、厳しい状況のこと", "苦労が多いわりに、実りが少ないこと"], "id": "w146"}, {"phrase": "二兎を追う者は一兎をも得ず", "reading": "にとをおうものはいっとをもえず", "meaning": "同時に二つのことをしようとすると、結局どちらも成功しないということ。", "example": "二兎を追う者は一兎をも得ずというから、まずは一つに集中しよう。", "distractorMeanings": ["目標は、高ければ高いほど良いということ", "一つのことを長く続ければ、必ず成功するということ"], "id": "w147"}, {"phrase": "根も葉もない", "reading": "ねもはもない", "meaning": "まったく事実の裏付けがなく、でたらめであること。", "example": "根も葉もないうわさが広まって困った。", "distractorMeanings": ["小さな出来事が、大きな問題に発展すること", "どこにでも見られる、ありふれた話であること"], "id": "w148"}, {"phrase": "鼻であしらう", "reading": "はなであしらう", "meaning": "相手を見下して、そっけなく冷たく対応すること。", "example": "相談したのに、鼻であしらわれてしまった。", "distractorMeanings": ["相手の話を、最後まで丁寧に聞くこと", "相手の失敗を、優しくフォローすること"], "id": "w149"}, {"phrase": "火に油を注ぐ", "reading": "ひにあぶらをそそぐ", "meaning": "すでに悪い状況を、さらにひどくする行動をとること。", "example": "怒っている人にさらに文句を言うのは、火に油を注ぐようなものだ。", "distractorMeanings": ["危険な状況を、いち早く収めて解決すること", "困っている人に、そっと手を差し伸べること"], "id": "w150"}], "yoji": [{"phrase": "一日千秋", "category": "数字系", "reading": "いちじつせんしゅう", "meaning": "一日が千年に感じられるほど、待ち遠しく思うこと。", "distractorMeanings": ["一つのことをして、同時に二つの利益を得ること。", "何度失敗してもあきらめずに立ち上がること。"], "id": "y1"}, {"phrase": "大同小異", "category": "反対語", "reading": "だいどうしょうい", "meaning": "細かい点は違うが、だいたいは同じであること。", "distractorMeanings": ["たくさんの人が口をそろえて同じことを言うこと。", "人によって考えや好みがそれぞれ違うこと。"], "id": "y2"}, {"phrase": "以心伝心", "category": "同じ漢字", "reading": "いしんでんしん", "meaning": "言葉に出さなくても、気持ちが相手に通じ合うこと。", "distractorMeanings": ["半分は信じ、半分は疑っている状態のこと。", "自分のしたことを自分でほめること。"], "id": "y3"}, {"phrase": "意味深長", "category": "間違えやすい", "reading": "いみしんちょう", "meaning": "言葉の裏に、深い意味がかくされていること。", "distractorMeanings": ["言葉では言い表せないほど、ひどいこと。", "話のはじめから終わりまで、全部のこと。"], "id": "y4"}, {"phrase": "馬耳東風", "category": "動物や色", "reading": "ばじとうふう", "meaning": "人の意見や忠告を聞き流して、気にしないこと。", "distractorMeanings": ["自分の都合の良いように物事を進めること。", "周りに人がいないかのように勝手にふるまうこと。"], "id": "y5"}, {"phrase": "一石二鳥", "category": "数字系", "reading": "いっせきにちょう", "meaning": "一つのことをして、同時に二つの利益を得ること。", "distractorMeanings": ["一日が非常に長く、待ち遠しく感じられること。", "二つとも似たり寄ったりで、大差がないこと。"], "id": "y6"}, {"phrase": "異口同音", "category": "反対語", "reading": "いくどうおん", "meaning": "多くの人が口をそろえて、同じことを言うこと。", "distractorMeanings": ["細かい違いはあるが、だいたい同じであること。", "言葉を使わなくても、心が通じ合うこと。"], "id": "y7"}, {"phrase": "半信半疑", "category": "同じ漢字", "reading": "はんしんはんぎ", "meaning": "半分は信じ、半分は疑っている気持ちのこと。", "distractorMeanings": ["生きるか死ぬかの、ぎりぎりの状態のこと。", "命令や方針が、朝と夕方で変わってしまうこと。"], "id": "y8"}, {"phrase": "言語道断", "category": "間違えやすい", "reading": "ごんごどうだん", "meaning": "あまりにもひどくて、言葉で言い表せないこと。", "distractorMeanings": ["一言で、ずばりと本題に入ること。", "今まで一度も聞いたことがないような出来事。"], "id": "y9"}, {"phrase": "花鳥風月", "category": "動物や色", "reading": "かちょうふうげつ", "meaning": "自然の美しい景色や、風流な趣のこと。", "distractorMeanings": ["白い砂浜と青々とした松林の美しい景色のこと。", "山や川の景色が清らかで、美しいこと。"], "id": "y10"}, {"phrase": "五里霧中", "category": "数字系", "reading": "ごりむちゅう", "meaning": "霧の中にいるように、物事の見通しが立たないこと。", "distractorMeanings": ["状況に応じて、すばやく適切に対応すること。", "非常に危険で、今にも命が危ういような状態。"], "id": "y11"}, {"phrase": "有名無実", "category": "反対語", "reading": "ゆうめいむじつ", "meaning": "名前だけは知られているが、中身がともなわないこと。", "distractorMeanings": ["誰から見ても正しく、公平で立派なこと。", "完全で、欠けているところが全くないこと。"], "id": "y12"}, {"phrase": "絶体絶命", "category": "同じ漢字", "reading": "ぜったいぜつめい", "meaning": "どうにも逃げられない、追いつめられた状況のこと。", "distractorMeanings": ["死にそうな状態から立ち直り、勢いを取り戻すこと。", "苦しくて、転げ回るほどつらいこと。"], "id": "y13"}, {"phrase": "単刀直入", "category": "間違えやすい", "reading": "たんとうちょくにゅう", "meaning": "前置きなしに、いきなり本題に入ること。", "distractorMeanings": ["言葉に表せないほど、ひどい行いのこと。", "昔のことを研究して、新しい知識を得ること。"], "id": "y14"}, {"phrase": "青天白日", "category": "動物や色", "reading": "せいてんはくじつ", "meaning": "よく晴れた空のように、疑いや後ろ暗さが何もないこと。", "distractorMeanings": ["白い砂浜と青い松林が続く、美しい景色のこと。", "ものごとの見通しが、まったく立たないこと。"], "id": "y15"}, {"phrase": "千変万化", "category": "数字系", "reading": "せんぺんばんか", "meaning": "状況が次々に、さまざまな形へ変化していくこと。", "distractorMeanings": ["人によって、好みや考え方がそれぞれ違うこと。", "ものごとの様子が、それぞれ違っていること。"], "id": "y16"}, {"phrase": "一部始終", "category": "反対語", "reading": "いちぶしじゅう", "meaning": "物事の最初から最後までの、全部のこと。", "distractorMeanings": ["半分は信じて、半分は疑っている気持ちのこと。", "命令や方針が、すぐに変わってしまうこと。"], "id": "y17"}, {"phrase": "自画自賛", "category": "同じ漢字", "reading": "じがじさん", "meaning": "自分のしたことを、自分でほめること。", "distractorMeanings": ["言葉を交わさなくても、気持ちが通じ合うこと。", "他人の意見に、自分の考えもなく従うこと。"], "id": "y18"}, {"phrase": "付和雷同", "category": "間違えやすい", "reading": "ふわらいどう", "meaning": "自分の考えを持たず、他人の意見にすぐ同調すること。", "distractorMeanings": ["多くの人が、声をそろえて同じことを言うこと。", "自分に都合よく、物事を運ぼうとすること。"], "id": "y19"}, {"phrase": "南船北馬", "category": "動物や色", "reading": "なんせんほくば", "meaning": "あちこち忙しく旅をして、絶えず移動すること。", "distractorMeanings": ["一つの物事から、同時に二つの利益を得ること。", "状況に合わせて、自由自在に行動を変えること。"], "id": "y20"}, {"phrase": "七転八起", "category": "数字系", "reading": "しちてんはっき", "meaning": "何度失敗しても、あきらめずに立ち上がること。", "distractorMeanings": ["苦しみのあまり、転げ回ってもがき苦しむこと。", "一日一日が、非常に待ち遠しく感じられること。"], "id": "y21"}, {"phrase": "朝令暮改", "category": "反対語", "reading": "ちょうれいぼかい", "meaning": "命令や決まりがすぐに変わって、定まらないこと。", "distractorMeanings": ["始めから終わりまで、態度や方針を変えないこと。", "前後があべこべになり、大事なことを見失うこと。"], "id": "y22"}, {"phrase": "右往左往", "category": "同じ漢字", "reading": "うおうさおう", "meaning": "どうしてよいか分からず、あちこち慌てて動き回ること。", "distractorMeanings": ["縦にも横にも、思うままに自由に動き回ること。", "状況に応じて、適切にすばやく対応すること。"], "id": "y23"}, {"phrase": "臨機応変", "category": "間違えやすい", "reading": "りんきおうへん", "meaning": "その場の状況に応じて、適切に対応すること。", "distractorMeanings": ["どうしてよいか分からず、あちこち動き回ること。", "人に頼らず、自分の力だけで物事を進めること。"], "id": "y24"}, {"phrase": "白砂青松", "category": "動物や色", "reading": "はくしゃせいしょう", "meaning": "白い砂浜と青々とした松が続く、美しい海岸の景色。", "distractorMeanings": ["自然の美しい景色や、風流な趣のこと。", "山や川の景色が清らかで、美しいこと。"], "id": "y25"}, {"phrase": "七転八倒", "category": "数字系", "reading": "しちてんばっとう", "meaning": "激しい苦しみのために、転げ回ってもがくこと。", "distractorMeanings": ["何度失敗しても、くじけずに立ち上がること。", "死にかけた状態から、勢いを取り戻すこと。"], "id": "y26"}, {"phrase": "起死回生", "category": "反対語", "reading": "きしかいせい", "meaning": "絶望的な状態から、一気に良い方向へ立て直すこと。", "distractorMeanings": ["どうにも逃げ場のない、追いつめられた状態のこと。", "危険がすぐそこまで、迫っている状態のこと。"], "id": "y27"}, {"phrase": "誠心誠意", "category": "同じ漢字", "reading": "せいしんせいい", "meaning": "偽りのない、真心のこもった気持ちで物事を行うこと。", "distractorMeanings": ["自分にできることは、自分でまかなうこと。", "生きるか死ぬかの、ぎりぎりの状態のこと。"], "id": "y28"}, {"phrase": "前代未聞", "category": "間違えやすい", "reading": "ぜんだいみもん", "meaning": "今まで一度も聞いたことがないような、珍しい出来事。", "distractorMeanings": ["あまりにひどくて、言葉にできないほどの行い。", "名前は有名だが、実際の中身がともなわないこと。"], "id": "y29"}, {"phrase": "竜頭蛇尾", "category": "動物や色", "reading": "りゅうとうだび", "meaning": "始めは勢いが盛んだが、終わりになるほど衰えること。", "distractorMeanings": ["見た目や名前だけが立派で、中身がともなわないこと。", "状況によって、どんどん姿を変えていくこと。"], "id": "y30"}, {"phrase": "一挙両得", "category": "数字系", "reading": "いっきょりょうとく", "meaning": "一つの行いで、同時に二つの利益を得ること。", "distractorMeanings": ["一日会わないだけで、千年も経ったように感じること。", "十人いれば、十人とも考え方が違うこと。"], "id": "y31"}, {"phrase": "因果応報", "category": "反対語", "reading": "いんがおうほう", "meaning": "良い行いにも悪い行いにも、それにふさわしい報いがあること。", "distractorMeanings": ["昔のことを学んで、新しい知識や考えを得ること。", "強いものが弱いものを支配し、打ち勝つこと。"], "id": "y32"}, {"phrase": "十人十色", "category": "同じ漢字", "reading": "じゅうにんといろ", "meaning": "好みや考え方は、人によってそれぞれ違うこと。", "distractorMeanings": ["細かい点は違っても、だいたいは同じであること。", "状況によって、様々に変化していくこと。"], "id": "y33"}, {"phrase": "付和雷同", "category": "間違えやすい", "reading": "ふわらいどう", "meaning": "自分の考えを持たず、他人の意見にすぐ同調すること。", "distractorMeanings": ["多くの人が、声をそろえて同じことを言うこと。", "自分に都合よく、物事を運ぼうとすること。"], "id": "y34"}, {"phrase": "山紫水明", "category": "動物や色", "reading": "さんしすいめい", "meaning": "山や川の景色が清らかで、美しいこと。", "distractorMeanings": ["白い砂浜と青い松林が続く、美しい海岸の景色。", "自然の美しい景色や、風流な趣のこと。"], "id": "y35"}, {"phrase": "千差万別", "category": "数字系", "reading": "せんさばんべつ", "meaning": "物事にはさまざまな違いがあり、一つ一つ異なること。", "distractorMeanings": ["状況が次々に、いろいろな形へ変わっていくこと。", "好みや考え方は、人によってそれぞれ違うこと。"], "id": "y36"}, {"phrase": "弱肉強食", "category": "反対語", "reading": "じゃくにくきょうしょく", "meaning": "弱い者が強い者の犠牲になる、厳しい生存競争のこと。", "distractorMeanings": ["良い行いにも悪い行いにも、ふさわしい報いがあること。", "周りを気にせず、自分勝手にふるまうこと。"], "id": "y37"}, {"phrase": "自給自足", "category": "同じ漢字", "reading": "じきゅうじそく", "meaning": "必要なものを、自分の力だけでまかなうこと。", "distractorMeanings": ["何にも頼らず、自分の力だけで道を切り開くこと。", "偽りなく、真心をこめて物事に取り組むこと。"], "id": "y38"}, {"phrase": "無我夢中", "category": "間違えやすい", "reading": "むがむちゅう", "meaning": "我を忘れるほど、一つのことに夢中になること。", "distractorMeanings": ["物事の見通しが立たず、どうしてよいか分からないこと。", "苦しくてもがき、転げ回るほどつらいこと。"], "id": "y39"}, {"phrase": "大器晩成", "category": "動物や色", "reading": "たいきばんせい", "meaning": "本当にすぐれた人物は、遅れて成功し実力を発揮すること。", "distractorMeanings": ["名前ばかりで、実際の中身がともなわないこと。", "見かけだけが立派で、内容がともなわないこと。"], "id": "y40"}, {"phrase": "危機一髪", "category": "数字系", "reading": "ききいっぱつ", "meaning": "髪の毛一本ほどの差で、危険が迫っている状態のこと。", "distractorMeanings": ["どうにも逃げられないほど、追いつめられた状況のこと。", "悪い状態から、一気に良い方向へ立て直すこと。"], "id": "y41"}, {"phrase": "終始一貫", "category": "反対語", "reading": "しゅうしいっかん", "meaning": "最初から最後まで、態度や考えを変えないこと。", "distractorMeanings": ["命令や決まりがすぐに変わって、定まらないこと。", "その場の状況に応じて、対応を変えること。"], "id": "y42"}, {"phrase": "適材適所", "category": "同じ漢字", "reading": "てきざいてきしょ", "meaning": "人の能力に合った、ふさわしい仕事や場所につけること。", "distractorMeanings": ["自分の力だけで、必要なものをまかなうこと。", "好みや考え方は、人によってそれぞれ違うこと。"], "id": "y43"}, {"phrase": "老若男女", "category": "間違えやすい", "reading": "ろうにゃくなんにょ", "meaning": "年齢や性別に関係なく、すべての人々のこと。", "distractorMeanings": ["良い行いにも悪い行いにも、報いがあること。", "弱い者が強い者に負けてしまう、厳しい競争。"], "id": "y44"}, {"phrase": "意気投合", "category": "動物や色", "reading": "いきとうごう", "meaning": "お互いの気持ちや考えが、ぴったりと合うこと。", "distractorMeanings": ["言葉を交わさなくても、心が通じ合うこと。", "自分の考えを持たず、他人にすぐ同調すること。"], "id": "y45"}, {"phrase": "一望千里", "category": "数字系", "reading": "いちぼうせんり", "meaning": "一目で見渡せるほど、遠くまで広がる景色のこと。", "distractorMeanings": ["一つの行いで、同時に二つの利益を得ること。", "一日会わないだけで、とても長く感じること。"], "id": "y46"}, {"phrase": "同工異曲", "category": "反対語", "reading": "どうこういきょく", "meaning": "やり方は違うが、出来ばえや内容はほとんど同じであること。", "distractorMeanings": ["細かい点は違うが、だいたいは同じであること。", "多くの人が、口をそろえて同じことを言うこと。"], "id": "y47"}, {"phrase": "自由自在", "category": "同じ漢字", "reading": "じゆうじざい", "meaning": "何ものにも縛られず、思いのままにふるまえること。", "distractorMeanings": ["縦にも横にも、思う存分自由に動き回ること。", "必要なものを、自分の力でまかなうこと。"], "id": "y48"}, {"phrase": "悪口雑言", "category": "間違えやすい", "reading": "あっこうぞうごん", "meaning": "相手を悪く言う、ひどい言葉をあれこれ並べ立てること。", "distractorMeanings": ["あまりにひどくて、言葉で言い表せないこと。", "周りに人がいないかのように、勝手にふるまうこと。"], "id": "y49"}, {"phrase": "公明正大", "category": "動物や色", "reading": "こうめいせいだい", "meaning": "私利私欲がなく、誰から見ても公平で正しいこと。", "distractorMeanings": ["疑いや後ろ暗いところが何もなく、潔白なこと。", "完全で、欠けているところが全くないこと。"], "id": "y50"}, {"phrase": "一進一退", "category": "数字系", "reading": "いっしんいったい", "meaning": "進んだり戻ったりして、なかなか良くならない状態。", "distractorMeanings": ["喜んだり心配したりと、気持ちが揺れ動くこと。", "生きるか死ぬかの、ぎりぎりの状態のこと。"], "id": "y51"}, {"phrase": "天変地異", "category": "反対語", "reading": "てんぺんちい", "meaning": "台風や地震など、自然に起こる激しい異変のこと。", "distractorMeanings": ["状況が次々に、さまざまな形へ変化していくこと。", "今まで一度も聞いたことがないような出来事。"], "id": "y52"}, {"phrase": "独立独歩", "category": "同じ漢字", "reading": "どくりつどっぽ", "meaning": "人に頼らず、自分の力だけで物事を進めていくこと。", "distractorMeanings": ["必要なものを、自分の力だけでまかなうこと。", "その場の状況に応じて、すばやく対応すること。"], "id": "y53"}, {"phrase": "温故知新", "category": "間違えやすい", "reading": "おんこちしん", "meaning": "昔のことを学び直して、新しい知識や考えを見つけること。", "distractorMeanings": ["前置きなしに、いきなり本題に入ること。", "良い行いにも悪い行いにも、報いがあること。"], "id": "y54"}, {"phrase": "我田引水", "category": "動物や色", "reading": "がでんいんすい", "meaning": "自分の都合のよいように、物事を考えたり進めたりすること。", "distractorMeanings": ["人の意見や忠告を聞き流して、気にしないこと。", "自分の考えを持たず、他人の意見にすぐ同調すること。"], "id": "y55"}, {"phrase": "一喜一憂", "category": "数字系", "reading": "いっきいちゆう", "meaning": "状況が変わるたびに、喜んだり心配したりすること。", "distractorMeanings": ["進んだり戻ったりして、なかなか良くならないこと。", "一日会わないだけで、とても長く感じられること。"], "id": "y56"}, {"phrase": "縦横無尽", "category": "反対語", "reading": "じゅうおうむじん", "meaning": "思う存分、自由自在に活躍したり動き回ったりすること。", "distractorMeanings": ["何ものにも縛られず、思いのままにふるまえること。", "どうしてよいか分からず、あちこち動き回ること。"], "id": "y57"}, {"phrase": "半死半生", "category": "同じ漢字", "reading": "はんしはんしょう", "meaning": "今にも死にそうなほど、弱りきっている状態のこと。", "distractorMeanings": ["半分は信じ、半分は疑っている気持ちのこと。", "どうにも逃げられない、追いつめられた状況のこと。"], "id": "y58"}, {"phrase": "順風満帆", "category": "間違えやすい", "reading": "じゅんぷうまんぱん", "meaning": "物事が何の障害もなく、順調に進んでいくこと。", "distractorMeanings": ["始めは勢いが盛んでも、終わりには衰えてしまうこと。", "その場の状況に応じて、すばやく対応すること。"], "id": "y59"}, {"phrase": "急転直下", "category": "動物や色", "reading": "きゅうてんちょっか", "meaning": "物事の状況が急に変化して、一気に解決に向かうこと。", "distractorMeanings": ["絶望的な状態から、一気に良い方向へ立て直すこと。", "危険がすぐそこまで、迫っている状態のこと。"], "id": "y60"}, {"phrase": "四苦八苦", "category": "数字系", "reading": "しくはっく", "meaning": "非常に苦しみ、あれこれ苦労すること。", "distractorMeanings": ["激しい苦しみのために、転げ回ってもがくこと。", "我を忘れるほど、一つのことに夢中になること。"], "id": "y61"}, {"phrase": "本末転倒", "category": "反対語", "reading": "ほんまつてんとう", "meaning": "大事なこととそうでないことを、取り違えてしまうこと。", "distractorMeanings": ["命令や決まりがすぐに変わって、定まらないこと。", "前後があべこべになり、あちこち慌てて動き回ること。"], "id": "y62"}, {"phrase": "再三再四", "category": "同じ漢字", "reading": "さいさんさいし", "meaning": "何度も何度も、繰り返し行うこと。", "distractorMeanings": ["何度失敗しても、あきらめずに立ち上がること。", "進んだり戻ったりして、なかなか良くならないこと。"], "id": "y63"}, {"phrase": "傍若無人", "category": "間違えやすい", "reading": "ぼうじゃくぶじん", "meaning": "周りの人のことを気にせず、勝手気ままにふるまうこと。", "distractorMeanings": ["自分の都合のよいように、物事を進めようとすること。", "あまりにひどくて、言葉で言い表せないこと。"], "id": "y64"}, {"phrase": "完全無欠", "category": "動物や色", "reading": "かんぜんむけつ", "meaning": "欠けているところが全くなく、完璧であること。", "distractorMeanings": ["誰から見ても公平で、私利私欲のないこと。", "名前だけが知られていて、中身がともなわないこと。"], "id": "y65"}, {"phrase": "心機一転", "category": "数字系", "reading": "しんきいってん", "meaning": "あることをきっかけに、気持ちをすっかり入れ替えること。", "distractorMeanings": ["進んだり戻ったりして、なかなか良くならないこと。", "状況が変わるたびに、喜んだり心配したりすること。"], "id": "y66"}, {"phrase": "取捨選択", "category": "反対語", "reading": "しゅしゃせんたく", "meaning": "良いものと悪いものを見分けて、必要なものだけを選び取ること。", "distractorMeanings": ["いろいろな意見を一つにまとめて、結論を出すこと。", "そのときの状況に合わせて、素早く対応を変えること。"], "id": "y67"}, {"phrase": "自業自得", "category": "同じ漢字", "reading": "じごうじとく", "meaning": "自分がした悪い行いの報いを、自分自身が受けること。", "distractorMeanings": ["人の力を借りず、自分のことは自分で行うこと。", "自分で自分のことをほめたたえること。"], "id": "y68"}, {"phrase": "古今東西", "category": "間違えやすい", "reading": "ここんとうざい", "meaning": "昔から今までの、あらゆる場所や時代。いつでもどこでも。", "distractorMeanings": ["東西南北、あらゆる方角のこと。", "昔の出来事を、詳しく調べ直すこと。"], "id": "y69"}, {"phrase": "喜怒哀楽", "category": "動物や色", "reading": "きどあいらく", "meaning": こと、辞任は役職を辞めること", "id": "r16"}, {"a": "美点", "aReading": "びてん", "b": "長所", "bReading": "ちょうしょ", "note": "美点はすぐれた良い点、長所は得意な面のこと", "id": "r17"}, {"a": "目標", "aReading": "もくひょう", "b": "目的", "bReading": "もくてき", "note": "目標は目指す具体的な地点、目的は成したいこと", "id": "r18"}, {"a": "返事", "aReading": "へんじ", "b": "応答", "bReading": "おうとう", "note": "返事は呼びかけに答えること、応答は問いに応じること", "id": "r19"}, {"a": "同意", "aReading": "どうい", "b": "賛成", "bReading": "さんせい", "note": "同意は考えを認めること、賛成はよいと支持すること", "id": "r20"}, {"a": "関心", "aReading": "かんしん", "b": "興味", "bReading": "きょうみ", "note": "関心は気にかけること、興味は面白いと感じる心", "id": "r21"}, {"a": "真心", "aReading": "まごころ", "b": "誠意", "bReading": "せいい", "note": "真心は偽りのない心、誠意はまじめな気持ち", "id": "r22"}, {"a": "改良", "aReading": "かいりょう", "b": "改善", "bReading": "かいぜん", "note": "改良は物を良く作り変えること、改善は状態を良くすること", "id": "r23"}, {"a": "発展", "aReading": "はってん", "b": "進展", "bReading": "しんてん", "note": "発展は勢いよく広がること、進展は先へ進むこと", "id": "r24"}, {"a": "苦労", "aReading": "くろう", "b": "苦心", "bReading": "くしん", "note": "苦労は大変な思いをすること、苦心は工夫して考え抜くこと", "id": "r25"}, {"a": "真実", "aReading": "しんじつ", "b": "真相", "bReading": "しんそう", "note": "真実はうそのない本当のこと、真相は隠れた事情", "id": "r26"}, {"a": "不安", "aReading": "ふあん", "b": "心配", "bReading": "しんぱい", "note": "不安は落ち着かない気持ち、心配は悪い事を気にかけること", "id": "r27"}, {"a": "進歩", "aReading": "しんぽ", "b": "向上", "bReading": "こうじょう", "note": "進歩は前より良く進むこと、向上は質が高まること", "id": "r28"}, {"a": "承知", "aReading": "しょうち", "b": "納得", "bReading": "なっとく", "note": "承知は頼みを聞き入れること、納得は理由がわかり認めること", "id": "r29"}, {"a": "主要", "aReading": "しゅよう", "b": "重要", "bReading": "じゅうよう", "note": "主要は中心となる主なもの、重要は大切で欠かせないもの", "id": "r30"}, {"a": "静養", "aReading": "せいよう", "b": "休養", "bReading": "きゅうよう", "note": "静養は静かに休み養うこと、休養は心身を休め養うこと", "id": "r31"}, {"a": "不平", "aReading": "ふへい", "b": "不満", "bReading": "ふまん", "note": "不平は不満を言葉に表すこと、不満は満足できない気持ち", "id": "r32"}], "homophoneGroups": [{"reading": "つとめる", "note": "「役割を果たす」→務める／「がんばる」→努める／「会社ではたらく」→勤める", "kanjiIds": ["k22", "k55", "k46"], "extra": []}, {"reading": "おさめる", "note": "「お金・物を渡す」→納める／「うまくまとめる・自分のものにする」→収める／「支配する・うまく整える」→治める", "kanjiIds": ["k13", "k207", "k284"], "extra": []}, {"reading": "そなえる", "note": "「神仏に品物をささげる」→供える／「準備しておく」→備える", "kanjiIds": ["k42", "k82"], "extra": []}, {"reading": "えいせい", "note": "「地球のまわりを回る天体・人工衛星」→衛星／「健康を守るための工夫」→衛生", "kanjiIds": ["k36"], "extra": [{"word": "衛生", "reading": "えいせい", "meaning": "病気を防ぎ、体をきれいで健康に保つための工夫のこと。", "example": "食事の前には手を洗い、衛生に気をつける。", "writingSentence": "食事の前は手を洗ってエイセイに気をつけよう。", "distractorReadings": ["えいしょう", "こうせい"], "altKanji": null}]}]};</script>
<script>
(function(){
"use strict";

/* ===================== data & constants ===================== */
var DATA = null;
var db = null;
var PROGRESS = {}; // docId -> {items:{id:{a,c,last,ts}}}
var PROGRESS_LOADED = {};

var CATS = [
  {key:'kanji', title:'漢字', short:'漢', desc:'読み方と意味をおぼえよう（書きは印刷でれんしゅう）', tag:'306語'},
  {key:'kotowaza', title:'ことわざ・慣用句', short:'諺', desc:'意味を知って使い方をおぼえよう', tag:'150こ'},
  {key:'yoji', title:'四字熟語', short:'熟', desc:'読み方と意味をおぼえよう', tag:'132こ'},
  {key:'taigigo', title:'反対語・対義語', short:'反', desc:'反対の意味の言葉を選ぼう', tag:'60組'},
  {key:'ruigigo', title:'類義語', short:'類', desc:'似た意味の言葉を選ぼう', tag:'32組'}
];

function listFor(catKey){
  if(catKey==='kanji') return DATA.kanji;
  if(catKey==='kotowaza') return DATA.kotowaza;
  if(catKey==='yoji') return DATA.yoji;
  if(catKey==='taigigo') return DATA.taigigo;
  if(catKey==='ruigigo') return DATA.ruigigo;
  return [];
}
function catMeta(key){ for(var i=0;i<CATS.length;i++) if(CATS[i].key===key) return CATS[i]; return null; }

/* docId per learning mode */
function docIdFor(catKey, sub){
  if(catKey==='kanji') return 'kanji-'+(sub||'reading'); // reading | meaning | writing
  return catKey;
}

/* ===================== utils ===================== */
function $(sel,root){return (root||document).querySelector(sel);}
function esc(s){ if(s==null) return ''; return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function shuffle(arr){ var a=arr.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function sampleN(arr,n){ return shuffle(arr).slice(0, n); }
function uid(){ return 'id'+Math.random().toString(36).slice(2,9); }
function todayStr(){ var d=new Date(); return d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate(); }

/* ===================== storage (db capability with localStorage fallback) ===================== */
var LS_PREFIX = 'kotonoha_progress_';

function loadProgressDoc(docId){
  if(PROGRESS_LOADED[docId]) return Promise.resolve(PROGRESS[docId]);
  PROGRESS_LOADED[docId]=true;
  if(db){
    return db.doc('progress/'+docId).get().then(function(snap){
      PROGRESS[docId] = (snap.exists && snap.data() && snap.data().items) ? {items:snap.data().items} : {items:{}};
      return PROGRESS[docId];
    }).catch(function(){
      PROGRESS[docId] = {items:{}};
      return PROGRESS[docId];
    });
  } else {
    try{
      var raw = localStorage.getItem(LS_PREFIX+docId);
      PROGRESS[docId] = raw ? JSON.parse(raw) : {items:{}};
    }catch(e){ PROGRESS[docId] = {items:{}}; }
    return Promise.resolve(PROGRESS[docId]);
  }
}

function statFor(docId, itemId){
  var p = PROGRESS[docId];
  if(!p || !p.items || !p.items[itemId]) return {a:0,c:0,last:null,ts:0};
  return p.items[itemId];
}

function recordResult(docId, itemId, correct){
  if(!PROGRESS[docId]) PROGRESS[docId] = {items:{}};
  var cur = PROGRESS[docId].items[itemId] || {a:0,c:0,last:null,ts:0};
  cur = {a:cur.a+1, c:cur.c+(correct?1:0), last:correct?1:0, ts:Date.now()};
  PROGRESS[docId].items[itemId] = cur;
  persist(docId, itemId, cur);
}

var persistQueue = {};
function persist(docId, itemId, cur){
  if(db){
    var patch = {items:{}};
    patch.items[itemId] = cur;
    db.doc('progress/'+docId).update(patch).catch(function(e){
      // doc may not exist yet
      db.doc('progress/'+docId).set(patch).catch(function(){});
    });
  } else {
    try{ localStorage.setItem(LS_PREFIX+docId, JSON.stringify(PROGRESS[docId])); }catch(e){}
  }
}

function logPrint(catKey, sub, ids){
  // lightweight non-essential log; ignore failures
  if(!db) return;
  var docId = 'printlog';
  db.doc('progress/'+docId).set({last:{cat:catKey,sub:sub||'', ts:Date.now(), count:ids.length}}).catch(function(){});
}

/* ===================== progress calc ===================== */
function catAccuracy(catKey){
  var items = listFor(catKey);
  var docIds = catKey==='kanji' ? ['kanji-reading','kanji-meaning'] : [docIdFor(catKey)];
  var seen=0, correct=0, attempted=0;
  docIds.forEach(function(docId){
    var p = PROGRESS[docId];
    if(!p) return;
    items.forEach(function(it){
      var s = p.items[it.id];
      if(s && s.a>0){ attempted++; seen+=s.a; correct+=s.c; }
    });
  });
  return {attempted:attempted, total: items.length*docIds.length, pct: seen? Math.round(100*correct/seen):0};
}

function weakItems(catKey, sub, limit){
  var items = listFor(catKey);
  var docId = docIdFor(catKey, sub);
  var p = PROGRESS[docId] || {items:{}};
  var withStat = items.map(function(it){
    var s = p.items[it.id];
    return {item:it, stat:s||{a:0,c:0,last:null,ts:0}};
  }).filter(function(x){ return x.stat.a>0; });
  withStat.sort(function(a,b){
    var pa = a.stat.c/a.stat.a, pb = b.stat.c/b.stat.a;
    if(pa!==pb) return pa-pb;
    return b.stat.ts-a.stat.ts;
  });
  return withStat.slice(0, limit||10);
}

/* selection strategy for quiz/print: 'all' | 'weak' | 'wrong' | 'random' */
function selectItems(catKey, sub, strategy, count){
  var items = listFor(catKey);
  var docId = docIdFor(catKey, sub);
  var p = PROGRESS[docId] || {items:{}};
  function stat(it){ return p.items[it.id] || {a:0,c:0,last:null,ts:0}; }
  var pool;
  if(strategy==='wrong'){
    pool = items.filter(function(it){ var s=stat(it); return s.a>0 && s.last===0; });
  } else if(strategy==='weak'){
    var wrongLast = items.filter(function(it){ var s=stat(it); return s.a>0 && s.last===0; });
    var lowAcc = items.filter(function(it){ var s=stat(it); return s.a>0 && s.last===1 && (s.c/s.a)<0.7; });
    var neverSeen = items.filter(function(it){ return stat(it).a===0; });
    wrongLast.sort(function(a,b){ return stat(a).c/stat(a).a - stat(b).c/stat(b).a; });
    lowAcc.sort(function(a,b){ return stat(a).c/stat(a).a - stat(b).c/stat(b).a; });
    pool = wrongLast.concat(lowAcc).concat(shuffle(neverSeen));
  } else if(strategy==='random'){
    pool = shuffle(items);
  } else { // all, in order
    pool = items.slice();
  }
  if(count && count>0) pool = pool.slice(0, count);
  return pool;
}

/* ===================== app state / routing ===================== */
var state = { screen:'home' };

function go(screen, params){
  state = Object.assign({}, params||{}, {screen:screen});
  render();
  window.scrollTo(0,0);
}

function render(){
  var app = $('#app');
  if(!DATA){ app.innerHTML = '<div style="padding:60px 0;text-align:center;color:var(--ink-soft)">読み込み中…</div>'; return; }
  if(state.screen==='home') return renderHome(app);
  if(state.screen==='category') return renderCategory(app);
  if(state.screen==='study') return renderStudy(app);
  if(state.screen==='quiz') return renderQuiz(app);
  if(state.screen==='quizResult') return renderQuizResult(app);
  if(state.screen==='print') return renderPrintConfig(app);
  if(state.screen==='backup') return renderBackup(app);
  app.innerHTML='';
}

/* ===================== HOME ===================== */
function renderHome(app){
  var cards = CATS.map(function(c){
    var acc = catAccuracy(c.key);
    return '<div class="cat-card" data-action="openCategory" data-cat="'+c.key+'">'+
      '<span class="tag">'+esc(c.tag)+'</span>'+
      '<h3 class="mincho">'+esc(c.title)+'</h3>'+
      '<p class="desc">'+esc(c.desc)+'</p>'+
      '<div class="bar"><i style="width:'+acc.pct+'%"></i></div>'+
      '<div class="stats"><span>正答率 '+acc.pct+'%</span><span>学習済み '+acc.attempted+'/'+acc.total+'</span></div>'+
    '</div>';
  }).join('');

  app.innerHTML =
    '<div class="topbar"><div class="brand"><span class="mark">ことのはノート</span><span class="sub">国語 学習アプリ</span></div><button class="icon-btn ghost" data-action="openBackup" style="font-size:12px;">⚙ 記録のバックアップ</button></div>'+
    '<div class="section-title">カテゴリを選ぶ</div>'+
    '<div class="grid">'+cards+'</div>';

  attachDelegation(app);
}

/* ===================== BACKUP / RESTORE ===================== */
var ALL_DOC_IDS = ['kanji-reading','kanji-meaning','kanji-writing','kotowaza','yoji','taigigo','ruigigo'];
function renderBackup(app){
  app.innerHTML =
    '<div class="topbar"><div class="crumb"><button data-action="goHome">ホーム</button><span>›</span><span>記録のバックアップ</span></div></div>'+
    '<div class="form-block"><h4>この端末に保存されている学習記録</h4>'+
      '<div style="font-size:13px;color:var(--ink-soft);line-height:1.8;">この画面のブラウザ（Safariなど）だけに保存されています。機種変更やSafariのデータ消去にそなえて、ときどき書き出しておくと安心です。</div>'+
    '</div>'+
    '<div class="form-block"><h4>書き出す（バックアップを保存）</h4>'+
      '<div style="font-size:13px;color:var(--ink-soft);margin-bottom:10px;">ボタンを押すとファイルが作られます。「ファイル」アプリなどに保存しておいてください。</div>'+
      '<button class="icon-btn accent" data-action="exportBackup">バックアップを書き出す</button>'+
    '</div>'+
    '<div class="form-block"><h4>読み込む（バックアップを復元）</h4>'+
      '<div style="font-size:13px;color:var(--ink-soft);margin-bottom:10px;">以前書き出したファイルを選ぶと、今の記録に上書きされます。</div>'+
      '<input type="file" accept="application/json" id="restoreFileInput" data-action="restoreFilePick">'+
    '</div>'+
    '<div id="backupMsg" style="font-size:13px;color:var(--good);"></div>';
  attachDelegation(app);
}
function exportBackupNow(){
  var out = {};
  ALL_DOC_IDS.forEach(function(id){ out[id] = PROGRESS[id] || {items:{}}; });
  var blob = new Blob([JSON.stringify(out)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  var d = new Date();

function restoreBackupFile(file){
  var reader = new FileReader();
  reader.onload = function(){
    try{
      var obj = JSON.parse(reader.result);
      ALL_DOC_IDS.forEach(function(id){
        if(obj[id] && obj[id].items){
          PROGRESS[id] = obj[id];
          PROGRESS_LOADED[id] = true;
          try{ localStorage.setItem(LS_PREFIX+id, JSON.stringify(PROGRESS[id])); }catch(e){}
          if(db){ db.doc('progress/'+id).set(PROGRESS[id]).catch(function(){}); }
        }
      });
      var msg = document.getElementById('backupMsg');
      if(msg) msg.textContent = '復元しました。ホームに戻って確認してください。';

      if(msg2){ msg2.style.color='var(--bad)'; msg2.textContent = 'ファイルの読み込みに失敗しました。'; }

  };

/* ===================== QUIZ ===================== */
function poolTexts(arr, field){ return arr.map(function(x){return x[field];}); }
function buildChoices(correctText, curated, pool, need){
  need = need||4;
  var set=[correctText];
  (curated||[]).forEach(function(w){ if(set.indexOf(w)===-1) set.push(w); });
  var extra = shuffle((pool||[]).filter(function(t){ return set.indexOf(t)===-1; }));
  var i=0;
  while(set.length<need && i<extra.length){ set.push(extra[i]); i++; }
  return shuffle(set);
}
function underlineHtml(sentence, word){
  if(!sentence){ return '<div class="stem-word mincho">'+esc(word)+'</div>'; }
  var idx = sentence.indexOf(word);
  if(idx===-1){ return '<div>'+esc(sentence)+'</div><div class="stem-word mincho">'+esc(word)+'</div>'; }
  var before=sentence.slice(0,idx), mid=sentence.slice(idx,idx+word.length), after=sentence.slice(idx+word.length);
  return '<div>'+esc(before)+'<u class="target">'+esc(mid)+'</u>'+esc(after)+'</div>';
}

function buildQuizQuestion(cat, sub, it){
  var q = {itemId: it.id};
  if(cat==='kanji' && sub==='reading'){
    q.instr = '次の――線の漢字の読み方を、ひらがなで答えなさい。';
    q.mainHtml = underlineHtml(it.example, it.word);
    q.correct = it.reading;
    q.choices = buildChoices(it.reading, it.distractorReadings, poolTexts(DATA.kanji,'reading'));
  } else if(cat==='kanji' && sub==='meaning'){
    q.instr = '――線の言葉の意味として最も適切なものを、次から選びなさい。';
    q.mainHtml = underlineHtml(it.example, it.word);
    q.correct = it.meaning;
    q.choices = buildChoices(it.meaning, [], poolTexts(DATA.kanji,'meaning'));
  } else if((cat==='kotowaza'||cat==='yoji') && sub==='meaning'){
    q.instr = '次の'+(cat==='kotowaza'?'ことわざ・慣用句':'四字熟語')+'の意味として最も適切なものを選びなさい。';
    q.mainHtml = '<div class="stem-word mincho">'+esc(it.phrase)+'</div>';
    q.correct = it.meaning;
    q.choices = buildChoices(it.meaning, it.distractorMeanings, poolTexts(listFor(cat),'meaning'));
  } else if((cat==='kotowaza'||cat==='yoji') && sub==='word'){
    q.instr = '次の意味を表す言葉として最も適切なものを選びなさい。';
    q.mainHtml = '<div style="font-size:17px;line-height:1.8">'+esc(it.meaning)+'</div>';
    q.correct = it.phrase;
    q.choices = buildChoices(it.phrase, [], poolTexts(listFor(cat),'phrase'));
  } else if(cat==='taigigo' || cat==='ruigigo'){
    var dir = Math.random()<0.5;
    var promptWord = dir ? it.a : it.b;
    var correct = dir ? it.b : it.a;
    var pool = poolTexts(listFor(cat), dir?'b':'a');
    q.instr = cat==='taigigo' ? '次の言葉の反対の意味を表す言葉を、あとから選びなさい。' : '次の言葉と意味が似ている言葉を、あとから選びなさい。';
    q.mainHtml = '<div class="stem-word mincho">'+esc(promptWord)+'</div>';
    q.correct = correct;
    q.choices = buildChoices(correct, [], pool);
  }
  return q;
}

/* ===================== event delegation ===================== */
function attachDelegation(app){ /* no-op: single global listener handles everything */ }

document.addEventListener('click', function(e){
  var el = e.target.closest('[data-action]');
  if(!el) return;
  var action = el.dataset.action;

  if(action==='openCategory'){ go('category', {cat: el.dataset.cat}); return; }
  if(action==='goHome'){ go('home'); return; }
  if(action==='backToCategory'){ go('category', {cat: state.cat}); return; }

  if(action==='enterMode'){
    var screen = el.dataset.screen, sub = el.dataset.sub;
    if(screen==='study'){ go('study', {cat:state.cat, sub:sub, idx:0, filter:'all'}); }
    else if(screen==='quiz'){ go('quiz', {cat:state.cat, sub:sub, phase:'setup'}); }
    else if(screen==='print'){ go('print', {cat:state.cat, sub:sub}); }
    return;
  }

  /* study */
  if(action==='flip' || action==='studyFlip'){
    state.flipped = !state.flipped;
    var fc = document.querySelector('.flip-card');
    if(fc) fc.classList.toggle('flipped', state.flipped);
    return;
  }
  if(action==='studyPrev'){
    state.idx = Math.max(0,(state.idx||0)-1); state.flipped=false; render(); return;
  }
  if(action==='studyNext'){
    var list = state._studyList||[];
    state.idx = Math.min(list.length-1,(state.idx||0)+1); state.flipped=false; render(); return;
  }

  /* quiz setup */
  if(action==='setStrategy'){ state.strategy = el.dataset.v; render(); return; }
  if(action==='startQuiz'){
    var queue = selectItems(state.cat, state.sub, state.strategy||'weak', state.count||15);
    if(queue.length===0){ alert('対象の問題がありません。範囲を変えてみてください。'); return; }
    var built = queue.map(function(it){ return Object.assign({raw:it}, buildQuizQuestion(state.cat, state.sub, it)); });
    state.queue = built; state.qidx=0; state.score=0; state.wrongItems=[]; state.phase='running'; state.answeredIdx=-1;
    render(); return;
  }
  if(action==='retryQuiz'){ go('quiz', {cat:state.cat, sub:state.sub, phase:'setup', strategy:state.strategy, count:state.count}); return; }

  /* quiz running */
  if(action==='answer'){
    if(state.answeredIdx===state.qidx) return;
    var val = decodeURIComponent(el.dataset.v);
    var q = state.queue[state.qidx];
    var correct = (val===q.correct);
    state.selected = val;
    state.answeredIdx = state.qidx;
    if(correct) state.score++;
    else state.wrongItems.push({label: itemLabel(state.cat, q.raw), correct:q.correct});
    var docId = docIdFor(state.cat, state.sub==='word'?'meaning':state.sub); // reverse-mode counts toward same stat bucket
    recordResult(docId, q.itemId, correct);
    render(); return;
  }
  if(action==='nextQuestion'){
    if(state.qidx+1>=state.queue.length){ go('quizResult', state); }
    else { state.qidx++; state.answeredIdx=-1; state.selected=null; render(); }
    return;
  }

  /* print */
  if(action==='setPStrategy'){ state.strategy = el.dataset.v; render(); return; }
  if(action==='doPrint'){
    var pqueue = selectItems(state.cat, state.sub, state.strategy||'random', state.count||15);
    if(pqueue.length===0){ alert('対象の問題がありません。範囲を変えてみてください。'); return; }
    document.getElementById('printArea').innerHTML = buildPrintHtml(state.cat, state.sub, pqueue);
    logPrint(state.cat, state.sub, pqueue);
    go('grade', {cat:state.cat, sub:state.sub, queue:pqueue, marks:{}});
    setTimeout(function(){ window.print(); }, 200);
    return;
  }

  /* grade */
  if(action==='markItem'){
    var id = el.dataset.id, v = parseInt(el.dataset.v,10);
    state.marks[id]=v; render(); return;
  }
  if(action==='saveGrade'){
    var docId2 = docIdFor(state.cat, state.sub);
    Object.keys(state.marks||{}).forEach(function(id){ recordResult(docId2, id, state.marks[id]===1); });
    go('category', {cat:state.cat}); return;
  }

  /* backup */
  if(action==='openBackup'){ go('backup', {}); return; }
  if(action==='exportBackup'){ exportBackupNow(); return; }
});

document.addEventListener('input', function(e){
  if(e.target.dataset && e.target.dataset.action==='setCount'){ state.count = parseInt(e.target.value,10); render(); }
  if(e.target.dataset && e.target.dataset.action==='setPCount'){ state.count = parseInt(e.target.value,10); render(); }
});
document.addEventListener('change', function(e){
  if(e.target.dataset && e.target.dataset.action==='studyFilter'){ state.filter = e.target.value; state.idx=0; state._studyList=null; render(); }
  if(e.target.dataset && e.target.dataset.action==='restoreFilePick'){
    var f = e.target.files && e.target.files[0];
    if(f) restoreBackupFile(f);
  }
});

/* patch render() to add print/grade screens */
var _origRender = render;
render = function(){
  var app = $('#app');
  if(!DATA){ app.innerHTML = '<div style="padding:60px 0;text-align:center;color:var(--ink-soft)">読み込み中…</div>'; return; }
  if(state.screen==='home') return renderHome(app);
  if(state.screen==='category') return renderCategory(app);
  if(state.screen==='study') return renderStudy(app);
  if(state.screen==='quiz') return renderQuiz(app);
  if(state.screen==='quizResult') return renderQuizResult(app);
  if(state.screen==='print') return renderPrintConfig(app);
  if(state.screen==='grade') return renderGrade(app);
  if(state.screen==='backup') return renderBackup(app);
  app.innerHTML='';
};

/* ===================== boot ===================== */
var _booted = false;
function boot(){
  if(_booted) return; _booted = true;
  var docIds = ['kanji-reading','kanji-meaning','kanji-writing','kotowaza','yoji','taigigo','ruigigo'];
  function ready(d){
    DATA = d;
    Promise.all(docIds.map(loadProgressDoc)).then(function(){ render(); });
    render();
  }
  function fail(){
    $('#app').innerHTML = '<div style="padding:60px 0;text-align:center;color:var(--bad)">データの読み込みに失敗しました。ページを再読み込みしてください。</div>';
  }
  if(window.__KOTONOHA_DATA__){
    ready(window.__KOTONOHA_DATA__);
    return;
  }
  fetch('data.json').then(function(r){return r.json();}).then(ready).catch(fail);
}

if(window.claude && window.claude.use){
  window.claude.use('db').then(function(d){ db=d; boot(); }).catch(function(){ boot(); });
  setTimeout(function(){ if(!DATA) boot(); }, 1200);
} else {
  boot();
}

})();
</script>
